function rendreMaintenant(){
  var a=iso(), gj=gestesLe(a), fj=faitesLe(a), alt=altitude();
  var sem=gestesSemaine(lundi()), semPre=gestesSemaine(isoPlus(lundi(),-7));
  var h=new Date().getHours();
  var plan=planDuJour();

  var htm='';

  /* entête : chiffres, pas de montagne */
  htm+='<div class="jour"><div class="d">'+esc(labelJour(a))+'</div>'+
    '<div class="s">'+(gj.length
      ? '<b>'+gj.length+'</b> '+(gj.length>1?'gestes':'geste')+' aujourd\'hui'+(fj.length?' · <b>'+fj.length+'</b> réglée'+(fj.length>1?'s':''):'')
      : (h<11?'Un seul geste et la journée est lancée.':'La journée est encore ouverte.'))+
    '</div></div>';

  htm+=fusee(alt);

  /* l'action — une seule chose à l'écran */
  htm+='<div id="zoneAct"></div>';

  /* mot de maman */
  var ch=Object.keys(db.cheers||{}).map(function(k){ return db.cheers[k]; })
    .filter(function(c){ return c&&now()-c.ts<36e5*20; }).sort(function(x,y){ return y.ts-x.ts; }).slice(0,1);
  htm+=ch.map(function(c){
    return '<div class="cheer"><div><div class="qui">'+esc(c.qui||"quelqu'un")+'</div><div class="msg">'+esc(c.msg)+'</div></div></div>';
  }).join("");

  /* la semaine, en compétition avec la précédente */
  htm+='<div class="stats">'+
    '<div class="f"><b>'+sem+'</b><span>cette semaine</span></div>'+
    '<div><b>'+semPre+'</b><span>semaine passée</span></div>'+
    '<div class="v"><b>'+alt+'</b><span>altitude</span></div></div>';

  /* la série et la réserve de jetons : le chiffre qu'il vient chercher */
  htm+=blocStreak();

  if(gj.length){
    htm+='<div class="carte"><div class="tit">Aujourd\'hui</div>'+
      gj.slice(-5).reverse().map(function(g){
        var d=new Date(g.ts);
        return '<div class="l"><span class="ok">✓</span><span>'+esc(g.t)+'</span>'+
               '<span style="margin-left:auto;color:var(--txt3);font-size:12px">'+pad(d.getHours())+':'+pad(d.getMinutes())+'</span></div>';
      }).join("")+'</div>';
  }

  el("vMaintenant").innerHTML=htm;
  animerStreak();
  el("altLab").innerHTML='altitude <b>'+alt+'</b>'+
    (semPre&&sem>=semPre?'<span class="cmp">tu es devant ta semaine passée</span>':
     semPre?'<span class="cmp">'+(semPre-sem)+' gestes pour rejoindre ta semaine passée</span>':'');

  /* zone d'action */
  var z=el("zoneAct");
  if(db.live&&db.live.id){ z.innerHTML=""; return; }

  if(!restantes().length){
    z.innerHTML='<div class="vide"><div class="g">🚀</div><h2>Il ne reste rien.</h2>'+
      '<p>La liste est vide. Va faire ce que tu voulais faire de ton temps.</p></div>';
    return;
  }

  /* le matin, on sert d'abord le plan écrit la veille */
  var x=null, source="";
  if(plan.length){ x=plan[0]; source= h<12 ? "ton plan d'hier soir" : "ton plan du jour"; }
  else{
    if(!propose||(T()[propose.id]&&T()[propose.id].fait)) propose=tirer();
    x=propose; source="pas besoin de choisir";
  }
  if(!x){ z.innerHTML=""; return; }

  var chantier=estChantier(x);
  z.innerHTML='<button class="act" id="bGo">'+
      '<div class="kick">'+(chantier?"un chantier à découper":esc(source))+'</div>'+
      '<div class="quoi">'+esc(x.t)+'</div>'+
      (chantier
        ? '<div class="geste"><em>premier geste</em>écrire trois ou quatre étapes, pas plus</div>'
        : (x.geste?'<div class="geste"><em>premier geste</em>'+esc(x.geste)+'</div>':''))+
      '<div class="meta">'+(chantier?"Ça ne se coche pas — ça se découpe. 2 minutes."
                                    :"2 minutes suffisent pour que ça compte")+'</div>'+
    '</button>'+
    (plan.length?'':'<button class="autre" id="bAutre">↻ une autre</button>')+
    '<button class="autre" id="bEdit">✎ modifier cette tâche</button>';
  el("bGo").onclick=function(){ if(chantier) decouper(x.id); else demarrer(x); };
  el("bEdit").onclick=function(){ editerTache(x.id); };
  if(el("bAutre")) el("bAutre").onclick=function(){
    var v=propose; propose=tirer();
    if(propose&&v&&propose.id===v.id) propose=tirer();
    rendreMaintenant();
  };
}

/* ---------- FOCUS : 2 minutes, puis le choix ---------- */
function rendreFocus(){
  var F=el("focus"), L=db.live;
  if(!L||!L.id||liveMasque()){ F.classList.add("hide"); F.innerHTML=""; F.dataset.id="";
    if(tick){clearInterval(tick);tick=null;} return; }

  var cle=L.id+"|"+L.phase;
  if(F.dataset.id!==cle){
    F.dataset.id=cle;
    F.classList.remove("hide");
    var geste=L.phase==="geste";
    F.innerHTML=
      '<div class="cat">'+esc(L.c||"")+(geste?'':' · budget '+hm(L.m||15))+'</div>'+
      '<h2 class="titre">'+esc(L.t)+'</h2>'+
      '<button class="fedit" id="fEdit">✎ modifier</button>'+
      (geste&&L.geste?'<div class="sous">'+esc(L.geste)+'</div>':'')+
      '<div class="mid">'+
        '<div class="anneau"><svg viewBox="0 0 100 100"><defs>'+
        '<linearGradient id="gf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd23f"/>'+
        '<stop offset="1" stop-color="#ff5a1f"/></linearGradient></defs>'+
        '<circle class="bg" cx="50" cy="50" r="45"/>'+
        '<circle class="fg" cx="50" cy="50" r="45" stroke-dasharray="282.7" stroke-dashoffset="0" id="arc"/>'+
        '</svg><div class="chrono" id="chrono">—</div></div>'+
        '<div id="noteBox"></div>'+
      '</div>'+
      '<div class="actions" id="fActions"></div>';
    majActions(false);
    if(el("fEdit")) el("fEdit").onclick=function(){ editerTache(L.id); };
    if(tick) clearInterval(tick);
    tick=setInterval(tic,1000); tic();
  }

  function majActions(fini){
    var L2=db.live; if(!L2) return;
    var A=el("fActions"); if(!A) return;
    var x=T()[L2.id]; if(x) x.id=L2.id;
    if(L2.phase==="geste"){
      A.innerHTML= fini
        ? '<button class="btn plein" id="a1">Je continue</button>'+
          '<button class="btn go" id="a2">J\'arrête ici — c\'est gagné</button>'
        : '<button class="btn go" id="a1b">C\'est déjà fait ✓</button>'+
          /* le moment exact où il bloque : c'est là que couper doit être offert */
          '<button class="btn gris" id="a3b">✂ Trop gros — je le divise</button>'+
          '<button class="btn gris" id="a2b">Pas capable là</button>';
      if(el("a1")) el("a1").onclick=function(){
        marquerGeste(x||{id:L2.id,t:L2.t},GESTE_SEC);
        put("/live",{id:L2.id,t:L2.t,c:L2.c,m:L2.m,geste:L2.geste,debut:now(),phase:"suite"}).then(rendre);
      };
      if(el("a2")) el("a2").onclick=function(){ marquerGeste(x||{id:L2.id,t:L2.t},GESTE_SEC); stopper(x,true); };
      if(el("a1b")) el("a1b").onclick=function(){ marquerGeste(x||{id:L2.id,t:L2.t},GESTE_SEC); terminer(x,(now()-L2.debut)/6e4); };
      if(el("a3b")) el("a3b").onclick=function(){
        put("/live",null).then(function(){ rendre(); diviser(L2.id); });
      };
      if(el("a2b")) el("a2b").onclick=function(){ reporter(x); };
    }else{
      A.innerHTML='<button class="btn go" id="b1">C\'est fait ✓</button>'+
        '<button class="btn gris" id="b2">J\'arrête ici</button>';
      el("b1").onclick=function(){ terminer(x,(now()-L2.debut)/6e4+2); };
      el("b2").onclick=function(){ stopper(x,false); toast("Le geste compte quand même."); };
    }
  }

  function tic(){
    var L2=db.live; if(!L2||!L2.debut) return;
    var c=el("chrono"); if(!c) return;
    var ec=(now()-L2.debut)/1000;
    var prevu=L2.phase==="geste"?GESTE_SEC:(L2.m||15)*60;
    var reste=prevu-ec, v=Math.abs(reste);
    c.innerHTML=(reste<0?"+":"")+Math.floor(v/60)+":"+pad(Math.floor(v%60))+
      (L2.phase==="geste"&&reste>0?'<small>le temps que ça compte</small>':'');
    c.classList.toggle("over",reste<0);
    var arc=el("arc"); if(arc) arc.setAttribute("stroke-dashoffset",(282.7*Math.max(0,Math.min(1,ec/prevu))).toFixed(1));

    var nb=el("noteBox"); if(!nb) return;
    if(L2.phase==="geste"&&reste<=0&&nb.dataset.on!=="1"){
      nb.dataset.on="1";
      nb.innerHTML='<div class="note gagne">✓ Deux minutes faites. <b>Ça compte comme une victoire complète.</b><br>'+
        'Tu peux arrêter là sans rien devoir à personne.</div>';
      vibre([25,60,25]); bip(); majActions(true);
    }
    if(L2.phase==="suite"&&reste<0&&nb.dataset.on!=="2"){
      nb.dataset.on="2";
      nb.innerHTML='<div class="note assez">Le budget que tu avais mis est écoulé.<br>'+
        '<b>C\'est assez bon.</b> Ferme ça et passe à autre chose.</div>';
      vibre([30,60,30]);
    }
  }
}

/* ---------- CHANTIERS : les projets qui ne se cochent pas ---------- */
function ouvrirChantier(id){
  var c=T()[id]; if(!c) return;
  var t=etapesToutes(id).sort(function(a,b){ return (a.fait?1:0)-(b.fait?1:0)||(a.ct||0)-(b.ct||0); });
  var av=avanceChantier(id);
  modale('<h3>'+esc(c.t)+'</h3>'+
    (av?'<div class="lb">'+av.fait+' étape'+(av.fait>1?'s':'')+' sur '+av.total+'</div>'+
        '<div class="jauge" style="margin:4px 0 12px"><i style="width:'+Math.round(av.fait/av.total*100)+'%"></i></div>'
       :'<div class="lb">Pas encore découpé.</div>')+
    '<div id="etList">'+(t.length?t.map(function(x){
      /* une étape peut elle-même avoir été redécoupée : on montre alors sa
         propre progression et on l'ouvre au lieu de la lancer */
      var sous=estChantier(x)?avanceChantier(x.id):null;
      return '<div class="tache'+(x.fait?" faite":"")+'" data-id="'+esc(x.id)+'"'+
        (sous?' data-sous="'+esc(x.id)+'"':'')+'>'+
        '<div class="case">'+(x.fait?"✓":"")+'</div>'+
        '<div class="corps"><div class="txt">'+esc(x.t)+'</div>'+
        '<div class="ss"><span>'+(sous?sous.fait+' / '+sous.total+' étapes':hm(x.m||15))+'</span></div>'+
        (sous?'<div class="jauge" style="margin:7px 0 0"><i style="width:'+Math.round(sous.fait/sous.total*100)+'%"></i></div>':'')+
        '</div>'+
        (x.fait?'':boutonDiviser(x.id))+
        (x.fait?'':'<div class="go">'+(sous?'Ouvrir':'Go')+'</div>')+'</div>';
    }).join(""):'<div class="slot">aucune étape pour l\'instant</div>')+'</div>'+
    '<button class="btn plein" id="cAdd" style="margin-top:12px">＋ Ajouter des étapes</button>'+
    '<div class="mini">Touche le texte d\'une étape pour changer sa durée, la découper encore, ou la retirer.<br>'+
      'Un chantier ne se coche pas lui-même : il se ferme tout seul quand ses étapes sont finies.</div>',
    function(box){
      /* Les actions faites depuis l'intérieur d'un chantier doivent le
         redessiner : sinon la progression affichée ment le temps d'un clic. */
      brancherLocks(box);
      Array.prototype.forEach.call(box.querySelectorAll(".tache[data-id]"),function(n){
        var x=T()[n.dataset.id]; if(!x) return;
        x=Object.assign({},x); x.id=n.dataset.id;
        var ca=n.querySelector(".case");
        if(ca) ca.onclick=function(e){ e.stopPropagation();
          basculer(x).then(function(){ if(T()[id]&&!T()[id].fait) ouvrirChantier(id); else fermer(); }); };
        var g=n.querySelector(".go");
        if(g) g.onclick=function(e){ e.stopPropagation();
          /* une étape redécoupée s'ouvre, elle ne se lance pas */
          if(n.dataset.sous) ouvrirChantier(n.dataset.sous);
          else { fermer(); demarrer(x); }
        };
        /* toucher le texte d'une étape ouvre ses réglages — sa durée compte
           autant que celle d'une tâche ordinaire dans la hauteur de la
           montagne, et elle n'était modifiable nulle part */
        var corps=n.querySelector(".corps");
        if(corps) corps.onclick=function(e){ e.stopPropagation(); editerTache(n.dataset.id,id); };
      });
      box.querySelector("#cAdd").onclick=function(){ decouper(id); };
    });
}

/* Découper : une étape par ligne, écrites d'un coup. Le but est que ça prenne
   deux minutes, pas que ce soit exhaustif — on peut en rajouter plus tard. */
function decouper(id){
  var c=T()[id]; if(!c) return;
  modale('<h3>Découper : '+esc(c.t)+'</h3>'+
    '<div class="lb">Une étape par ligne. Écris ce qui te vient, pas la liste parfaite.</div>'+
    '<textarea class="champ" id="dTxt" rows="7" placeholder="Appeler le magasin&#10;Mesurer l\'espace pour le frigo&#10;Regarder les annonces Marketplace"></textarea>'+
    '<button class="btn plein" id="dOk">Ajouter ces étapes</button>'+
    '<div class="mini">Trois ou quatre suffisent pour commencer. Tu en ajouteras en cours de route.</div>',
    function(box){
      var ta=box.querySelector("#dTxt");
      setTimeout(function(){ ta.focus(); },120);
      box.querySelector("#dOk").onclick=async function(){
        var lignes=ta.value.split("\n").map(function(s){ return s.trim(); }).filter(function(s){ return s; });
        if(!lignes.length){ fermer(); return; }
        var aj={};
        lignes.forEach(function(s){
          aj["e"+rid(4)]={ t:s, c:c.c||"Projet", p:c.p||3, m:15, ct:now(), fait:null, reports:0, parent:id };
        });
        await patch("/tasks",aj);
        fermer(); toast(lignes.length+" étape"+(lignes.length>1?"s":"")+" ajoutée"+(lignes.length>1?"s":""));
        rendre();
      };
    });
}

/* ---------- MÉNAGE ÉCLAIR : remettre la liste à jour, une carte à la fois ----------
   Une liste vieille de trois mois contient forcément des choses déjà réglées.
   Les revoir en bloc dans un document, c'est une corvée qui n'avance rien ;
   les revoir une par une, c'est une victoire par carte. */
var menage=false, menageVus=0;

function aRevoir(){
  return restantes().filter(function(x){ return !x.revu; })
    .sort(function(a,b){ return (a.p||4)-(b.p||4)||(a.m||15)-(b.m||15); });
}
function rendreMenage(){
  var f=aRevoir();
  if(!f.length||menageVus>=12){
    var fini=!f.length;
    el("vListe").innerHTML='<div class="vide"><div class="g">'+(fini?"✨":"👍")+'</div>'+
      '<h2>'+(fini?"Liste passée au complet.":"Ça suffit pour à soir.")+'</h2>'+
      '<p>'+menageVus+' tâche'+(menageVus>1?"s":"")+' revue'+(menageVus>1?"s":"")+'.'+
      (fini?'':' Tu peux t\'arrêter là — ou continuer si t\'es lancé.')+'</p>'+
      (fini?'':'<button class="btn plein" id="mPlus" style="margin-top:16px">Continuer</button>')+
      '<button class="btn gris" id="mFin" style="margin-top:8px">Revenir à la liste</button></div>';
    el("mFin").onclick=function(){ menage=false; menageVus=0; rendreListe(); };
    if(el("mPlus")) el("mPlus").onclick=function(){ menageVus=0; rendreMenage(); };
    return;
  }
  var x=f[0];
  el("vListe").innerHTML=
    '<div class="carte" style="margin-top:0"><div class="tit">Ménage'+
      (menageVus?' — '+menageVus+' revue'+(menageVus>1?'s':''):'')+'</div>'+
    '<div class="aide">Elle tient encore, celle-là ?</div></div>'+
    '<div class="carte" style="text-align:center;padding:26px 18px">'+
      '<div style="font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--txt3)">'+esc(x.c||"")+'</div>'+
      '<div style="font-size:21px;font-weight:800;line-height:1.25;margin-top:10px">'+esc(x.t)+'</div>'+
    '</div>'+
    '<button class="btn go" id="mOk" style="margin-top:10px">Je l\'ai faite ✓</button>'+
    '<button class="btn plein" id="mGarde" style="margin-top:8px">Toujours à faire</button>'+
    '<button class="btn gris" id="mNon" style="margin-top:8px">Ça ne s\'applique plus</button>'+
    '<div class="mini" style="text-align:center">« Ça ne s\'applique plus » la retire sans te créditer de rien.</div>'+
    '<button class="autre" id="mStop">j\'arrête le ménage</button>';

  el("mOk").onclick=function(){
    menageVus++;
    patch("/tasks/"+x.id,{fait:now(),vieux:1,revu:now()}).then(function(){
      if(T()[x.id]){ T()[x.id].fait=now(); T()[x.id].vieux=1; }
      celebrer(x,true,true); rendreMenage();
      setTimeout(function(){
        toastAction("Déjà réglé.","annuler",function(){ decocher(x.id,null); menageVus--; rendreMenage(); });
      },1500);
    });
  };
  el("mGarde").onclick=function(){
    menageVus++; patch("/tasks/"+x.id,{revu:now()}).then(rendreMenage);
  };
  el("mNon").onclick=function(){
    menageVus++;
    patch("/tasks/"+x.id,{annule:now(),revu:now()}).then(function(){
      toast("Retirée. Aucun crédit — tu ne l'as pas faite.");
      rendreMenage();
    });
  };
  el("mStop").onclick=function(){ menage=false; menageVus=0; rendreListe(); };
}

/* ---------- LISTE : repliée, jamais un mur ---------- */
var LAB={1:["⚡ Vite fait","var(--p1)"],2:["🔴 Gros morceaux","var(--p2)"],
         3:["🟡 Quand ça adonne","var(--p3)"],4:["🟢 Plus tard","var(--p4)"]};
function rendreListe(){
  if(menage){ rendreMenage(); return; }
  /* le champ de recherche est réécrit à chaque rendu (le flux peut en
     déclencher un pendant la frappe) : on lui rend son focus et son curseur */
  var avaitFocus=document.activeElement&&document.activeElement.id==="qList";
  var l=liste(), htm='';
  htm+='<input class="champ rech" id="qList" autocomplete="off" '+
    'placeholder="🔎 chercher dans toutes les tâches" value="'+esc(recherche)+'">'+
    '<div id="resRech"></div><div id="listeNormale">';
  var nRevoir=aRevoir().length;
  if(nRevoir){
    htm+='<button class="btn gris" id="bMenage" style="margin-bottom:12px">🧹 Ménage éclair — remettre la liste à jour</button>';
  }
  var chips=[["tout","Par pile"],["fait","✓ Réglées"]];
  var cats={}; l.forEach(function(x){ if(!x.fait) cats[x.c||"Autre"]=1; });
  Object.keys(cats).sort().forEach(function(c){ chips.push(["c:"+c,c]); });
  htm+='<div class="filtres">'+chips.map(function(c){
    return '<button class="chip'+(filtre===c[0]?" on":"")+'" data-f="'+esc(c[0])+'">'+esc(c[1])+'</button>';
  }).join("")+'</div>';

  /* Les étapes vivent dans leur chantier, les annulées nulle part. */
  l=l.filter(function(x){ return !x.annule&&!x.parent; });
  if(filtre==="fait"){
    var f=l.filter(function(x){ return x.fait; }).sort(function(a,b){ return b.fait-a.fait; });
    htm+='<div class="carte" style="margin-top:0"><div class="tit">'+f.length+' réglées depuis le début</div>'+
      (f.length?'<div class="aide">Touche la case verte pour remettre une tâche dans la liste.</div>'
               :'<div class="rien">Ça commence aujourd\'hui.</div>')+'</div>';
    htm+=f.slice(0,60).map(ligne).join("");
  }
  else if(filtre.indexOf("c:")===0){
    var c=filtre.slice(2), g=l.filter(function(x){ return !x.fait&&(x.c||"Autre")===c; });
    g.sort(function(a,b){ return (a.m||15)-(b.m||15); });
    htm+=g.map(ligne).join("");
  }
  else{
    [1,2,3,4].forEach(function(p){
      var g=l.filter(function(x){ return !x.fait&&x.p===p; });
      if(!g.length) return;
      g.sort(function(a,b){ return (a.m||15)-(b.m||15); });
      var min=0; g.forEach(function(x){ min+=(x.m||15); });
      var ouv=!!ouverts[p];
      htm+='<button class="grp'+(ouv?" ouvert":"")+'" data-g="'+p+'">'+
        '<span class="pt" style="background:'+LAB[p][1]+'"></span>'+LAB[p][0]+
        '<span class="cpt">'+g.length+' · '+hm(min)+'</span><span class="fl">›</span></button>';
      if(ouv) htm+=g.map(ligne).join("");
    });
    htm+='<div class="mini" style="text-align:center;margin-top:16px">Les piles restent fermées exprès.<br>Une montagne ouverte, ça paralyse.</div>';
  }
  htm+='</div>';
  el("vListe").innerHTML=htm;

  var q=el("qList");
  q.oninput=function(){ recherche=q.value; dessinerRecherche(); };
  if(avaitFocus){ q.focus(); try{ q.setSelectionRange(q.value.length,q.value.length); }catch(e){} }
  dessinerRecherche();

  if(el("bMenage")) el("bMenage").onclick=function(){ menage=true; menageVus=0; rendreMenage(); window.scrollTo(0,0); };
  Array.prototype.forEach.call(el("vListe").querySelectorAll(".chip"),function(b){
    b.onclick=function(){ filtre=b.dataset.f; rendreListe(); };
  });
  Array.prototype.forEach.call(el("vListe").querySelectorAll("[data-g]"),function(b){
    b.onclick=function(){ ouverts[b.dataset.g]=!ouverts[b.dataset.g]; rendreListe(); };
  });
  brancherTaches(el("vListe"));
}
/* ---------- CHERCHER DANS TOUTE LA LISTE ----------
   La liste normale cache beaucoup de choses, et c'est voulu : les piles sont
   repliées, les étapes vivent dans leur chantier, les tâches réglées sont
   derrière un filtre. Quand tu sais ce que tu cherches, tout ça devient un
   obstacle — la recherche passe donc au travers de tout, y compris des étapes
   et de ce qui est déjà réglé. */
function dessinerRecherche(){
  var z=el("resRech"), n=el("listeNormale");
  if(!z||!n) return;
  var f=sansAccents(recherche).trim();
  if(!f){ z.innerHTML=""; n.classList.remove("hide"); return; }
  n.classList.add("hide");

  var res=liste().filter(function(x){ return !x.annule&&correspond(x,f); });
  /* ce qui reste à faire d'abord, le réglé ensuite ; puis les plus courtes */
  res.sort(function(a,b){
    return (a.fait?1:0)-(b.fait?1:0) || (a.p||4)-(b.p||4) || (a.m||15)-(b.m||15);
  });

  if(!res.length){
    z.innerHTML='<div class="carte" style="margin-top:0"><div class="rien">Rien qui correspond à « '+esc(recherche.trim())+' ».</div></div>';
    return;
  }
  var reste=res.filter(function(x){ return !x.fait; }).length;
  z.innerHTML='<div class="carte" style="margin-top:0"><div class="tit">'+
      res.length+' résultat'+(res.length>1?'s':'')+
      (reste<res.length?' · '+reste+' à faire':'')+'</div></div>'+
    res.slice(0,80).map(ligne).join("")+
    (res.length>80?'<div class="mini" style="text-align:center">Affiche les 80 premiers. Précise ta recherche.</div>':'');
  brancherTaches(z);
}

function ligne(x){
  if(estChantier(x)&&!x.fait){
    var av=avanceChantier(x.id);
    return '<div class="tache" data-ch="'+esc(x.id)+'">'+
      '<div class="case" style="border-radius:5px;border-style:dashed">🧱</div>'+
      '<div class="corps"><div class="txt">'+esc(x.t)+'</div><div class="ss">'+
        '<span>'+(av?av.fait+' / '+av.total+' étapes':'à découper')+'</span><span>'+esc(x.c||"")+'</span></div>'+
        (av?'<div class="jauge" style="margin:7px 0 0"><i style="width:'+Math.round(av.fait/av.total*100)+'%"></i></div>':'')+
      '</div>'+boutonLock(x.id,x.prive)+'<div class="go">Ouvrir</div></div>';
  }
  return '<div class="tache'+(x.fait?" faite":"")+'" data-id="'+esc(x.id)+'">'+
    '<div class="case">'+(x.fait?"✓":"")+'</div>'+
    '<div class="corps"><div class="txt">'+esc(x.t)+'</div><div class="ss">'+
      '<span>'+hm(x.m||15)+'</span><span>'+esc(x.c||"")+'</span>'+
      ((x.reports||0)>=2?'<span style="color:var(--jaune)">reportée '+x.reports+'×</span>':'')+
      (attendDepuis(x)?'<span style="color:var(--jaune)">prévue il y a '+attendDepuis(x)+' j</span>':'')+
      /* une étape trouvée par la recherche doit dire d'où elle vient */
      (x.parent&&T()[x.parent]?'<span style="color:var(--flamme)">🧱 '+esc(T()[x.parent].t)+'</span>':'')+
    '</div></div>'+
    (x.fait?'':boutonDiviser(x.id))+boutonLock(x.id,x.prive)+
    (x.fait
      ? (estChantier(x)?'<div class="go" data-open="'+esc(x.id)+'">Ouvrir</div>':'')
      : '<div class="go">Go</div>')+'</div>';
}
function brancherTaches(scope){
  brancherLocks(scope);
  Array.prototype.forEach.call(scope.querySelectorAll(".tache[data-ch]"),function(n){
    n.onclick=function(){ ouvrirChantier(n.dataset.ch); };
  });
  Array.prototype.forEach.call(scope.querySelectorAll(".tache[data-id]"),function(n){
    var x=T()[n.dataset.id]; if(!x) return; x=Object.assign({},x); x.id=n.dataset.id;
    var c=n.querySelector(".case");
    if(c) c.onclick=function(e){ e.stopPropagation(); n.classList.add("pop"); basculer(x); };
    var g=n.querySelector(".go");
    if(g) g.onclick=function(e){ e.stopPropagation();
      /* un chantier déjà fermé s'ouvre quand même : c'est le seul chemin vers
         ses étapes si l'une d'elles a été cochée par erreur */
      if(g.dataset.open) ouvrirChantier(g.dataset.open); else demarrer(x);
    };
    /* toucher le texte ouvre les réglages de la tâche */
    var corps=n.querySelector(".corps");
    if(corps) corps.onclick=function(e){ e.stopPropagation(); editerTache(n.dataset.id); };
  });
}
/* Le cadenas doit couper le clic : sur une ligne, il est posé au milieu d'une
   zone qui ouvre le chantier ou la fiche. */
function brancherLocks(scope){
  Array.prototype.forEach.call(scope.querySelectorAll("[data-cut]"),function(b){
    b.onclick=function(e){ e.stopPropagation(); e.preventDefault(); diviser(b.dataset.cut); };
  });
  Array.prototype.forEach.call(scope.querySelectorAll("[data-lock]"),function(b){
    b.onclick=function(e){ e.stopPropagation(); e.preventDefault(); basculerPrive(b.dataset.lock); };
  });
  Array.prototype.forEach.call(scope.querySelectorAll("[data-lockr]"),function(b){
    b.onclick=function(e){ e.stopPropagation(); e.preventDefault(); basculerPriveReve(b.dataset.lockr); };
  });
}

/* Régler une tâche : son titre, sa durée, sa pile.
   La durée compte pour de vrai — c'est elle qui fixe la hauteur de la montagne. */
/* `retour` : l'identifiant du chantier d'où l'on vient, pour y revenir après
   l'enregistrement plutôt que de retomber sur la liste. */
function editerTache(id,retour){
  var x=T()[id]; if(!x) return;
  var choix=[5,10,15,20,30,45,60,90,120,180];
  function sortir(){
    fermer();
    /* si on vient de modifier la tâche affichée en plein écran, il faut forcer
       son redessin : le focus ne se refait que lorsque son identifiant change */
    var F=el("focus"); if(F) F.dataset.id="";
    rendre();
    if(retour&&T()[retour]) ouvrirChantier(retour);
  }
  var enCours=!!(db.live&&db.live.id===id);
  modale('<h3>'+(x.parent?"Régler l\'étape":"Régler la tâche")+'</h3>'+
    '<div class="lb">Ce qu\'il y a à faire</div>'+
    '<textarea class="champ" id="eT" rows="2">'+esc(x.t)+'</textarea>'+
    '<div class="lb">Combien de temps ça prend, à peu près</div>'+
    '<div class="durs" id="eDur">'+choix.map(function(v){
      return '<button class="dur'+((x.m||15)===v?" on":"")+'" data-m="'+v+'">'+(v<60?v+" min":(v/60)+" h")+'</button>';
    }).join("")+'</div>'+
    '<div class="lb" style="margin-top:12px">Dans quelle pile</div>'+
    '<div class="durs" id="ePil">'+[1,2,3,4].map(function(p){
      return '<button class="dur'+((x.p||4)===p?" on":"")+'" data-p="'+p+'">'+LAB[p][0]+'</button>';
    }).join("")+'</div>'+
    '<button class="btn plein" id="eOk" style="margin-top:14px">Enregistrer</button>'+
    '<button class="btn gris" id="eCut" style="margin-top:8px">✂ Diviser en plus petites étapes</button>'+
    (estChantier(x)&&etapesToutes(id).length===0
      ? '<button class="btn gris" id="eCh" style="margin-top:8px">Redevenir une tâche simple</button>' : '')+
    '<button class="btn gris" id="ePriv" style="margin-top:8px">'+
      (x.prive?'🔒 Cachée du témoin — la remontrer':'👁 Visible par le témoin — la cacher')+'</button>'+
    '<button class="btn gris" id="eSup" style="margin-top:8px;color:var(--rouge)">Ça ne s\'applique plus</button>'+
    '<div class="mini">Changer la durée ajuste la hauteur de la montagne et ton pourcentage. C\'est voulu : une estimation plus juste vaut mieux qu\'un beau chiffre.</div>'+
    '<div class="mini">Une tâche cachée disparaît de la page du témoin, avec ses étapes et tout ce qu\'elle a fait apparaître dans son fil. '+
      'À savoir : ça la retire de son écran, ça ne la chiffre pas.</div>',
    function(box){
      var mm=x.m||15, pp=x.p||4;
      Array.prototype.forEach.call(box.querySelectorAll("[data-m]"),function(b){
        b.onclick=function(){ mm=+b.dataset.m;
          Array.prototype.forEach.call(box.querySelectorAll("[data-m]"),function(o){ o.classList.toggle("on",o===b); }); };
      });
      Array.prototype.forEach.call(box.querySelectorAll("[data-p]"),function(b){
        b.onclick=function(){ pp=+b.dataset.p;
          Array.prototype.forEach.call(box.querySelectorAll("[data-p]"),function(o){ o.classList.toggle("on",o===b); }); };
      });
      box.querySelector("#eOk").onclick=function(){
        var maj={ t:box.querySelector("#eT").value.trim()||x.t, m:mm, p:pp };
        /* en local tout de suite : la fenêtre du chantier se rouvre juste
           après et doit déjà montrer la nouvelle durée */
        Object.assign(x,maj);
        patch("/tasks/"+id,maj).then(function(){
          /* le titre affiché en plein écran est une copie : il faut le
             corriger lui aussi, sinon l'ancien nom reste sous les yeux */
          if(enCours){
            db.live.t=maj.t; db.live.m=maj.m;
            return patch("/live",{t:maj.t,m:maj.m});
          }
        }).then(sortir);
      };
      box.querySelector("#eCut").onclick=function(){ fermer(); diviser(id); };
      if(box.querySelector("#eCh")) box.querySelector("#eCh").onclick=function(){
        patch("/tasks/"+id,{ chantier:null }).then(function(){
          if(T()[id]) T()[id].chantier=null;
          sortir();
        });
      };
      box.querySelector("#ePriv").onclick=function(){
        var v=x.prive?null:1;
        patch("/tasks/"+id,{ prive:v }).then(function(){
          if(T()[id]) T()[id].prive=v;
          toast(v?"Cachée du témoin 🔒":"Visible par le témoin"); sortir();
        });
      };
      box.querySelector("#eSup").onclick=function(){
        if(T()[id]) T()[id].annule=now();
        patch("/tasks/"+id,{ annule:now(), revu:now() }).then(function(){
          /* on ne peut pas rester en plein écran sur une tâche qui vient
             d'être retirée */
          if(enCours){ db.live={}; return put("/live",null); }
        }).then(function(){
          toast("Retirée — sans crédit."); sortir();
        });
      };
    });
}

/* ---------- CE SOIR ---------- */
/* Un créneau du plan : il se coche là où il est, sinon rien ne saurait jamais
   si la tâche a été faite. Et s'il traîne, il dit depuis quand — factuellement,
   sans reproche : « prévue il y a 3 jours », pas « 3 jours de retard ». */
function slotPlan(id,jour){
  var x=T()[id]; if(!x) return "";
  var att=attendDepuis(x);
  return '<div class="slot plein'+(x.fait?" faite":"")+'">'+
    '<div class="case" data-coche="'+esc(id)+'">'+(x.fait?"✓":"")+'</div>'+
    /* toucher le texte ouvre les réglages complets — nom, durée, pile, et
       « ça ne s'applique plus ». Le ✎ reste réservé au contrat si-alors. */
    '<span class="cn" data-edt="'+esc(id)+'">'+esc(x.t)+
      (x.quand?'<div class="qd">⏰ '+esc(x.quand)+'</div>':'')+
      (x.geste?'<div class="gs">→ '+esc(x.geste)+'</div>':'')+
      (att&&!x.fait?'<div class="depuis">prévue <b>'+(att===1?"hier":"il y a "+att+" jours")+'</b> — elle reste là tant qu\'elle tient</div>':'')+
      (!x.fait&&(!x.quand||!x.geste)?'<div class="manque">à compléter : quand + premier geste</div>':'')+
    '</span>'+(x.fait?'':boutonDiviser(id))+boutonLock(id,x.prive)+
    '<button class="x" data-ed="'+esc(id)+'">✎</button>'+
    '<button class="x" data-del="'+esc(id)+'" data-jour="'+esc(jour)+'">×</button></div>';
}

function rendreSoir(){
  var a=iso(), demain=isoPlus(a,1);
  var j=(db.jours||{})[demain]||{};
  /* une tâche retirée d'un revers de main ne doit plus encombrer le plan */
  function auPlan(id){ return visibleId(id)&&!T()[id].annule; }
  var plan=(j.plan||[]).filter(auPlan);
  var planAuj=((((db.jours||{})[a])||{}).plan||[]).filter(auPlan);
  var gj=gestesLe(a), fj=faitesLe(a);
  var dim=new Date().getDay()===0;
  var htm='';

  /* bilan factuel — jamais évaluatif */
  htm+='<div class="carte" style="margin-top:0"><h3>Ce que tu dis ce soir</h3>'+
    '<div class="script">Aujourd\'hui : <span class="c">'+gj.length+'</span> '+(gj.length>1?'gestes':'geste')+
    (fj.length?', <span class="c">'+fj.length+'</span> tâche'+(fj.length>1?'s':'')+' réglée'+(fj.length>1?'s':''):'')+'.<br>'+
    (gj.length?gj.slice(-4).map(function(g){ return '· '+esc(g.t); }).join("<br>")
              :'<span style="color:var(--txt3)">Rien aujourd\'hui. Ça arrive. On regarde demain.</span>')+
    '</div></div>';

  /* ce que tu avais prévu pour aujourd'hui — c'est ici que ça se coche */
  if(planAuj.length){
    var restant=planAuj.filter(function(id){ return !T()[id].fait; }).length;
    htm+='<div class="carte"><h3>Ce que tu avais prévu aujourd\'hui</h3>'+
      '<div class="aide">'+(restant
        ? 'Coche ce que tu as fait. Ce qui reste glisse à demain et garde sa date — rien ne se perd.'
        : 'Les trois sont tombées. C\'est une journée pleine.')+'</div>'+
      planAuj.map(function(id){ return slotPlan(id,a); }).join("")+'</div>';
  }

  /* le plan de demain : 3 max, avec contrat si-alors */
  htm+='<div class="carte"><h3>Demain — 3 maximum</h3>'+
    '<div class="aide">Trois, pas quatre. Une liste de dix demain matin, c\'est une liste de zéro demain soir.</div>';
  for(var i=0;i<3;i++){
    var id=plan[i];
    if(id) htm+=slotPlan(id,demain);
    else htm+='<button class="slot" data-add="1"><span class="num">'+(i+1)+'</span><span class="cn">choisir une tâche…</span></button>';
  }
  if(plan.length){
    var prets=plan.filter(function(id){ return T()[id].quand&&T()[id].geste; });
    htm+='<div class="script">Demain je fais :<br>'+plan.map(function(id,k){
      var x=T()[id];
      return '<span class="c">'+(k+1)+'.</span> '+esc(x.t)+(x.quand?' <span style="color:var(--txt3)">('+esc(x.quand)+')</span>':'');
    }).join("<br>")+'</div>';
    if(prets.length<plan.length)
      htm+='<div class="mini">Un « quand » et un premier geste par tâche : c\'est la partie qui fait la différence le matin.</div>';
    if(j.approuve) htm+='<div class="appr">✓ Plan approuvé par '+esc(j.approuve.qui||"quelqu'un")+'</div>';
  }
  htm+='</div>';

  /* dimanche : la note de la semaine */
  if(dim){
    var l=lundi(), sm=(db.semaines||{})[l]||{};
    htm+='<div class="carte"><h3>Dimanche — ta note de la semaine</h3>'+
      '<div class="aide">'+gestesSemaine(l)+' gestes cette semaine. Ta meilleure : '+meilleureSemaine()+'.</div>'+
      '<div class="script" style="margin-top:9px">'+(sm.note?('Note : <span class="c">'+esc(sm.note)+'/10</span><br>'+esc(sm.resume||'')):'Pas encore écrite.')+'</div>'+
      '<button class="btn gris" style="margin-top:10px" id="bSem">'+(sm.note?'Modifier':'Écrire 2-3 phrases')+'</button></div>';
  }

  /* la boîte */
  var b=Object.keys(db.boite||{}).map(function(k){ var o=Object.assign({},db.boite[k]); o.k=k; return o; });
  htm+='<div class="carte"><h3>La boîte'+(b.length?' — '+b.length:'')+'</h3>'+
    '<div class="aide">Les idées attrapées pendant la journée. On les trie le soir, jamais pendant l\'action.</div>'+
    (b.length?b.map(function(o){
      return '<div class="slot plein"><span class="cn">'+esc(o.t)+'</span><button class="x" data-b="'+esc(o.k)+'">＋</button></div>';
    }).join(""):'<div class="slot">rien en attente</div>')+'</div>';

  el("vSoir").innerHTML=htm;

  brancherLocks(el("vSoir"));
  Array.prototype.forEach.call(el("vSoir").querySelectorAll("[data-add]"),function(n){ n.onclick=function(){ choisir(demain); }; });
  Array.prototype.forEach.call(el("vSoir").querySelectorAll("[data-ed]"),function(n){ n.onclick=function(){ contrat(n.dataset.ed); }; });
  Array.prototype.forEach.call(el("vSoir").querySelectorAll("[data-edt]"),function(n){
    n.onclick=function(e){ e.stopPropagation(); editerTache(n.dataset.edt); };
  });
  Array.prototype.forEach.call(el("vSoir").querySelectorAll("[data-coche]"),function(n){
    n.onclick=function(e){ e.stopPropagation();
      var x=T()[n.dataset.coche]; if(!x) return;
      var slot=n.closest?n.closest(".slot"):null; if(slot) slot.classList.add("pop");
      x=Object.assign({},x); x.id=n.dataset.coche; basculer(x);
    };
  });
  Array.prototype.forEach.call(el("vSoir").querySelectorAll("[data-del]"),function(n){
    n.onclick=function(){
      /* on relit le plan au moment du clic : l'écran peut dater d'avant une
         synchro, et écraser avec une version périmée effacerait autre chose */
      var d=n.dataset.jour;
      var p=((((db.jours||{})[d])||{}).plan||[]).filter(function(x){ return x!==n.dataset.del; });
      put("/jours/"+d+"/plan",p)
        /* on retire aussi sa date de prévision, sinon elle reviendrait
           d'elle-même dans le plan du lendemain */
        .then(function(){ return patch("/tasks/"+n.dataset.del,{prevu:null}); })
        .then(function(){ if(T()[n.dataset.del]) T()[n.dataset.del].prevu=null; rendre(); });
    };
  });
  Array.prototype.forEach.call(el("vSoir").querySelectorAll("[data-b]"),function(n){ n.onclick=function(){ trier(n.dataset.b); }; });
  if(el("bSem")) el("bSem").onclick=noteSemaine;
}

/* Choisir pour demain : tout est accessible, mais l'ordre fait le travail.
   Les plus pertinentes d'abord, et un champ de recherche pour aller droit au
   but quand tu sais déjà ce que tu cherches. */
function choisir(d){
  var tous=candidats().sort(function(a,b){ return scorer(b)-scorer(a); });

  modale('<h3>Ajouter à demain</h3>'+
    '<input class="champ" id="chQ" placeholder="🔎 chercher…" autocomplete="off">'+
    '<div id="chList" style="max-height:52vh;overflow:auto;margin:0 -2px"></div>'+
    '<div class="mini" id="chNb"></div>',
    function(box){
      var q=box.querySelector("#chQ"), zone=box.querySelector("#chList");

      function dessiner(){
        var f=sansAccents(q.value).trim();
        var sel=tous.filter(function(x){ return correspond(x,f); });
        zone.innerHTML = sel.length
          ? sel.map(function(x){
              var p=x.parent?T()[x.parent]:null;
              return '<div class="tache" data-pick="'+esc(x.id)+'"><div class="corps">'+
                '<div class="txt">'+esc(x.t)+'</div><div class="ss">'+
                '<span>'+hm(x.m||15)+'</span><span>'+esc(x.c||"")+'</span>'+
                (p?'<span style="color:var(--flamme)">🧱 '+esc(p.t)+'</span>':'')+
                (estChantier(x)?'<span style="color:var(--flamme)">à découper</span>':'')+
                '</div></div></div>';
            }).join("")
          : '<div class="slot">rien qui correspond</div>';
        box.querySelector("#chNb").textContent = sel.length+" tâche"+(sel.length>1?"s":"")+
          (f?" trouvée"+(sel.length>1?"s":""):" au choix — les plus utiles en premier");
        brancher();
      }
      function brancher(){
        Array.prototype.forEach.call(zone.querySelectorAll("[data-pick]"),function(n){
          n.onclick=function(){
            var id=n.dataset.pick;
            var j=(db.jours||{})[d]||{}, p=(j.plan||[]).slice();
            if(p.indexOf(id)<0&&p.length<3) p.push(id);

            }).then(function(){ fermer(); contrat(id); });
          };
        });
      }
      q.oninput=dessiner;

/* ---------- LE GRAPHIQUE DE MONTÉE ----------
   Y = travail accompli. X = les jours. La courbe ne redescend jamais :
   ajouter des tâches déplace la cible, ça n'efface pas ce qui est fait.
   Un jour sans rien = un trait horizontal. C'est le but. */
function heures(min){
  if(min<60) return min+" min";
  var h=min/60;
  return (h<10?h.toFixed(1).replace(".0",""):Math.round(h))+" h";
}
function graphique(){
  var s=serieJours();
  if(s.length<2){
    return '<div class="carte"><div class="tit">La montée</div>'+
      '<div class="aide">Le graphique se remplit à partir d\'aujourd\'hui — il faut au moins deux jours pour tracer une ligne. Reviens demain.</div></div>';
  }
  var W=320, H=150, PL=6, PR=6, PT=14, PB=6;
  var maxY=0; s.forEach(function(p){ if(p.cible>maxY) maxY=p.cible; });
  maxY=Math.max(maxY,60);
  var n=s.length;
  function X(i){ return PL + (n===1?0:i/(n-1))*(W-PL-PR); }
  function Y(v){ return H-PB - (v/maxY)*(H-PT-PB); }

  var ptsFait=s.map(function(p,i){ return X(i)+","+Y(p.fait); }).join(" ");
  var ptsCible=s.map(function(p,i){ return X(i)+","+Y(p.cible); }).join(" ");
  var aire="M"+X(0)+","+(H-PB)+" L"+s.map(function(p,i){ return X(i)+","+Y(p.fait); }).join(" L")+" L"+X(n-1)+","+(H-PB)+" Z";

  /* grille : hairlines pleines, une nuance au-dessus du fond */
  var grille="";
  for(var k=1;k<=3;k++){
    var y=PT+(H-PT-PB)*k/4;
    grille+='<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="rgba(255,255,255,.06)" stroke-width="1"/>';
  }

  var d=s[n-1], pct=d.cible?Math.round(d.fait/d.cible*100):0;

  /* ---- le rythme, jour par jour ----
     La courbe du haut dit la vérité sur l'ampleur : quand il reste cinquante
     heures, une bonne journée y est forcément un tout petit trait. Ça, on n'y
     touche pas — mentir sur la proportion enlèverait au graphique la seule
     chose qu'il apporte. On ajoute plutôt en dessous ce que chaque journée a
     donné, à sa propre échelle : là, une bonne journée se voit. */
  var HB=54, deltas=s.map(function(p,i){ return i?Math.max(0,p.fait-s[i-1].fait):p.fait; });
  var maxB=0; deltas.forEach(function(v){ if(v>maxB) maxB=v; });
  maxB=Math.max(maxB,30);
  var bw=(W-PL-PR)/n;
  var barres=deltas.map(function(v,i){
    if(!v) return "";
    var h=Math.max(2,v/maxB*(HB-10));
    return '<rect x="'+(PL+i*bw+bw*0.16).toFixed(1)+'" y="'+(HB-2-h).toFixed(1)+'" '+
      'width="'+Math.max(1.2,bw*0.68).toFixed(1)+'" height="'+h.toFixed(1)+'" fill="#ff8a2b" opacity=".85"/>';
  }).join("");
  var meilleurJour=maxB;

  /* zones de survol : une bande par jour, largeur minimale confortable */
  var zones=s.map(function(p,i){
    var w=(W-PL-PR)/Math.max(1,n-1);
    return '<rect class="zn" data-i="'+i+'" x="'+(X(i)-w/2).toFixed(1)+'" y="0" width="'+w.toFixed(1)+'" height="'+H+'" fill="transparent"/>';
  }).join("");

  return '<div class="carte"><div class="tit">La montée</div>'+
    '<div class="gwrap">'+
    '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" id="gsvg" role="img" aria-label="Travail accompli par rapport au total à faire, jour par jour">'+
      '<defs><linearGradient id="gaire" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0" stop-color="#ff8a2b" stop-opacity=".30"/>'+
        '<stop offset="1" stop-color="#ff8a2b" stop-opacity="0"/></linearGradient></defs>'+
      grille+
      '<path d="'+aire+'" fill="url(#gaire)"/>'+
      '<polyline points="'+ptsCible+'" fill="none" stroke="#8f9ab8" stroke-width="1.5" stroke-dasharray="4 3" stroke-linejoin="round"/>'+
      '<polyline points="'+ptsFait+'" fill="none" stroke="#ff8a2b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
      '<circle cx="'+X(n-1)+'" cy="'+Y(d.fait)+'" r="4.5" fill="#ff8a2b" stroke="#0d1428" stroke-width="2"/>'+
      '<line class="cross hide" id="gcross" y1="0" y2="'+H+'" stroke="rgba(255,255,255,.28)" stroke-width="1"/>'+
      zones+
    '</svg>'+
    '<div class="glab"><span><i class="k" style="background:#ff8a2b"></i>réglé '+heures(d.fait)+' · '+pct+' %</span>'+
      '<span><i class="k" style="background:#8f9ab8"></i>à jour sur tout : '+heures(d.cible)+'</span>'+
      '<span style="margin-left:auto;color:var(--txt3)">'+labelCourt(s[0].j)+' → aujourd\'hui</span></div>'+
    '<div class="gtip" id="gtip"></div>'+
    '</div>'+
    '<div class="aide" style="margin-top:10px">La ligne pleine, c\'est ce que tu as réglé. La pointillée en haut, c\'est la barre à atteindre pour être à jour sur tout — elle monte quand tu ajoutes, elle descend quand tu retires ce qui ne s\'applique plus.</div>'+
    /* le rythme quotidien, à son échelle : c'est ici que les journées se voient */
    '<div class="tit" style="margin:14px 0 0">Ce que chaque journée a donné</div>'+
    '<div class="gbars"><svg viewBox="0 0 '+W+' '+HB+'" preserveAspectRatio="none" role="img" aria-label="Travail réglé chaque jour">'+
      '<line x1="'+PL+'" y1="'+(HB-1)+'" x2="'+(W-PR)+'" y2="'+(HB-1)+'" stroke="rgba(255,255,255,.10)" stroke-width="1"/>'+
      barres+'</svg></div>'+
    '<div class="glab"><span style="color:var(--txt3)">chaque barre = une journée · la plus haute vaut '+heures(meilleurJour)+'</span></div>'+
    '<button class="autre" id="gTab" style="margin-top:2px">voir les chiffres</button>'+
    '<div id="gTable"></div>'+
    '</div>';
}
function labelCourt(j){
  var p=j.split("-");
  return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("fr-CA",{day:"numeric",month:"short"});
}
function brancherGraphique(){
  var svg=el("gsvg"); if(!svg) return;
  var s=serieJours(), tip=el("gtip"), cross=el("gcross");
  function montrer(i){
    var p=s[i]; if(!p) return;
    var prev=i>0?s[i-1]:null;
    var delta=prev?p.fait-prev.fait:p.fait;
    tip.innerHTML='<b>'+labelCourt(p.j)+'</b> — '+heures(p.fait)+' sur '+heures(p.cible)+
      (delta>0?' · <span style="color:var(--flamme)">+'+heures(delta)+' ce jour-là</span>':' · rien ce jour-là');
    tip.classList.add("on");
    var W=320, PL=6, PR=6, n=s.length;
    var x=PL+(n===1?0:i/(n-1))*(W-PL-PR);
    cross.setAttribute("x1",x); cross.setAttribute("x2",x); cross.classList.remove("hide");
  }
  Array.prototype.forEach.call(svg.querySelectorAll(".zn"),function(z){
    z.addEventListener("pointerenter",function(){ montrer(+z.dataset.i); });
    z.addEventListener("pointerdown",function(){ montrer(+z.dataset.i); });
  });
  svg.addEventListener("pointerleave",function(){ tip.classList.remove("on"); cross.classList.add("hide"); });

  var b=el("gTab");
  if(b) b.onclick=function(){
    var z=el("gTable");
    if(z.innerHTML){ z.innerHTML=""; b.textContent="voir les chiffres"; return; }
    b.textContent="cacher les chiffres";
    var der=s.slice(-14).reverse();
    z.innerHTML='<table class="gt"><tr><th>jour</th><th>fait</th><th>total</th></tr>'+
      der.map(function(p){ return '<tr><td>'+labelCourt(p.j)+'</td><td>'+heures(p.fait)+'</td><td>'+heures(p.cible)+'</td></tr>'; }).join("")+
      '</table>';
  };
}

    tab("soir","🌙","Ce soir",soir||b>0)+

    /* le lien de partage ouvre l'app entière, plus un écran de suivi */
    (maman?tab("suivi","👥","Suivi",false):"");
  Array.prototype.forEach.call(el("nav").querySelectorAll("button"),function(x){
    x.onclick=function(){ vue=x.dataset.v; rendre(); window.scrollTo(0,0); };
  });
}
function tab(v,e,l,pip){
  return '<button data-v="'+v+'" class="'+(vue===v?"on":"")+'">'+(pip?'<span class="pip"></span>':'')+
    '<span class="e">'+e+'</span>'+l+'</button>';
}

/* ---------- MODALES ---------- */
function modale(h,apres){
  var m=el("modale");
  m.innerHTML='<div class="modal"><div class="feuille">'+h+'</div></div>';
  m.querySelector(".modal").onclick=function(e){ if(e.target===this) fermer(); };
  if(apres) apres(m);
}
function fermer(){ el("modale").innerHTML=""; }

function attraper(){
  var act=!!(db.live&&db.live.id);
  modale('<h3>Attrape l\'idée</h3>'+
    '<input class="champ" id="qi" placeholder="Ça vient de me passer par la tête…" autocomplete="off">'+
    '<button class="btn plein" id="qok">Dans la boîte</button>'+
    '<div class="mini">'+(act?'Tu es en train de faire quelque chose. Ça va dans la boîte — on n\'y touche pas avant ce soir.'
      :'Ça va dans la boîte, tu la tries ce soir. C\'est ce qui t\'empêche d\'allonger ta liste pendant que tu la vides.')+'</div>'+
    /* un objectif de vie n'est pas une tâche : il ne passe pas par la boîte,
       il s'écrit tout de suite, au moment où l'idée est claire */
    '<button class="btn gris" id="qReve" style="margin-top:14px">⭐ Ce n\'est pas une tâche — c\'est un objectif de vie</button>',
    function(box){
      var i=box.querySelector("#qi"); setTimeout(function(){ i.focus(); },120);
      function go(){ var v=i.value.trim(); if(!v) return;
        pousser("boite",{ts:now(),t:v}).then(function(){ fermer(); toast("Dans la boîte."); rendre(); }); }
      box.querySelector("#qok").onclick=go;
      i.onkeydown=function(e){ if(e.key==="Enter") go(); };
      box.querySelector("#qReve").onclick=function(){ fermer(); editerReve(null); };
    });
}

function reglages(){
  var base=location.origin+location.pathname+"#r="+room;
  var lien=base+"&m=1", mien=base;
  var nCache=liste().filter(function(x){ return x.prive; }).length
            +Object.keys(db.reves||{}).filter(function(k){ return (db.reves[k]||{}).prive; }).length;
  modale('<h3>Réglages</h3>'+
    '<div class="lb">Le lien du témoin</div>'+
    '<button class="btn plein" id="gLien">📋 Copier le lien du témoin</button>'+
    '<div class="mini" style="margin-top:7px">Ce qui est marqué 🔒 n\'y apparaît pas'+
      (nCache?' — <b>'+nCache+' élément'+(nCache>1?'s':'')+' caché'+(nCache>1?'s':'')+'</b> en ce moment':'')+
      '.<br><span style="word-break:break-all;color:var(--txt2)">'+esc(lien)+'</span></div>'+
    '<div class="lb" style="margin-top:15px">Ton lien à toi</div>'+
    '<button class="btn gris" id="gMien">📋 Copier mon lien</button>'+
    '<div class="mini" style="margin-top:7px">Celui-ci montre tout. À garder pour toi.'+
      '<br><span style="word-break:break-all;color:var(--txt2)">'+esc(mien)+'</span></div>'+
    '<div class="lb" style="margin-top:15px">Le reste</div>'+
    '<button class="btn gris" id="gSon">'+(ls(K_SON)==="0"?"🔇 Sons éteints":"🔊 Sons allumés")+'</button>'+
    '<button class="btn gris" id="gSave" style="margin-top:8px">💾 Sauvegarder mes données</button>'+
    '<div class="mini">Jetons en réserve : <b>'+jetonsReste()+'</b>. Tu en gagnes <b>1 par semaine</b> et ils s\'accumulent. '+
      'Le jour où tes trois tâches ne tombent pas toutes, un jeton part tout seul : ta série tient et ton altitude ne bouge pas. '+
      'Sans jeton, la série repart à zéro.</div>'+
    '<div class="mini" style="color:var(--txt2)">⚠️ À savoir, pour que ce soit dit : cacher un élément le retire de l\'écran '+
      'du témoin, pas de la base. Quelqu\'un qui a le lien du témoin et qui sait où chercher pourrait '+
      'les retrouver. C\'est un rideau, pas un coffre-fort.</div>',
    function(box){
      function copier(v){
        try{ navigator.clipboard.writeText(v); toast("Lien copié ✓"); }catch(e){ toast("Copie le lien ci-dessous"); }
      }
      box.querySelector("#gLien").onclick=function(){ copier(lien); };
      box.querySelector("#gMien").onclick=function(){ copier(mien); };
      box.querySelector("#gSon").onclick=function(){
        ls(K_SON,ls(K_SON)==="0"?"1":"0"); fermer(); toast(ls(K_SON)==="0"?"Sons éteints":"Sons allumés");
      };
      box.querySelector("#gSave").onclick=function(){
        try{
          var b=new Blob([JSON.stringify(db,null,1)],{type:"application/json"});
          var a=document.createElement("a");
          a.href=URL.createObjectURL(b); a.download="decollage-"+iso()+".json";
          document.body.appendChild(a); a.click(); a.remove();
          toast("Sauvegarde téléchargée ✓");
        }catch(e){ toast("Sauvegarde impossible ici"); }
      };
    });
}

/* ---------- étoiles ---------- */
function etoiles(){
  var c=el("etoiles"), x=c.getContext("2d");
  function t(){
    var r=Math.min(window.devicePixelRatio||1,2);
    c.width=innerWidth*r; c.height=innerHeight*r;
    c.style.width=innerWidth+"px"; c.style.height=innerHeight+"px";
    x.setTransform(r,0,0,r,0,0); x.clearRect(0,0,innerWidth,innerHeight);
    for(var i=0;i<100;i++){
      x.globalAlpha=.14+Math.random()*.55; x.fillStyle="#fff";
      x.beginPath(); x.arc(Math.random()*innerWidth,Math.random()*innerHeight*.8,Math.random()*1.3+.3,0,7); x.fill();
    }
  }
  t(); addEventListener("resize",t);
}

/* ============================================================
   DÉMARRAGE
   ============================================================ */
function hash(){
  var o={}; location.hash.replace(/^#/,"").split("&").forEach(function(kv){
    var p=kv.split("="); if(p[0]) o[p[0]]=decodeURIComponent(p[1]||"");
  }); return o;
}

async function demarrage(){
  etoiles();
  var h=hash();
  maman=h.m==="1";
  room=h.r||ls(K_ROOM);
  if(!room){ room=rid(16); location.hash="#r="+room; }
  if(!maman) ls(K_ROOM,room);
  if(!location.hash) location.hash="#r="+room;

  el("btnAdd").onclick=attraper;
  el("btnMenu").onclick=reglages;
  /* le lien de partage donne les mêmes droits ; il ouvre juste sur le suivi */
  if(maman) vue="suivi";

  connecter();
  try{
    var r=await fetch(url(),{cache:"no-store"});
    if(r.ok){ var d=await r.json(); if(d) db=Object.assign(db,d); }
  }catch(e){}
  normaliser();

  if(!maman){
    if(typeof SEED!=="undefined"&&typeof REVES!=="undefined"
       &&(!db.meta||db.meta.seed!==SEED_VERSION||db.meta.reves!==REVES_VERSION)) await semer();
    await reglerJetons();
    await reporterPlans();
  }
  rendre();
  setInterval(function(){ if(vue==="maintenant"||vue==="suivi") planifier(); },30000);
}

document.addEventListener("visibilitychange",function(){
  if(!document.hidden){
    planifier();
    if(el("conn").dataset.s!=="live") connecter();
    /* l'app reste souvent ouverte d'un jour à l'autre : c'est ici que les
       tâches prévues hier et pas faites glissent dans le plan du jour */
    if(!maman) reporterPlans().then(planifier);
  }
});

/* changer de salon (ou ouvrir le lien du témoin depuis une page déjà ouverte)
   doit repartir à neuf, sinon on affiche les données du salon précédent */
addEventListener("hashchange",function(){
  var h=hash();
  if((h.r&&h.r!==room)||((h.m==="1")!==maman)) location.reload();
});

demarrage();
})();
</script>
