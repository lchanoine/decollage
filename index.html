<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Décollage">
<title>Décollage</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<style>
/* ============================================================
   PALETTE
   ============================================================ */
:root{
  --nuit:#070b18; --nuit2:#0d1428;
  --surf:rgba(255,255,255,.055); --surf2:rgba(255,255,255,.10); --bord:rgba(255,255,255,.10);
  --txt:#e9edfb; --txt2:#9aa5c4; --txt3:#6b7699;
  --flamme:#ff8a2b; --vert:#2ee27a; --jaune:#ffd23f; --rouge:#ff6b81; --bleu:#5ec8ff;
  --p1:#ff9f1c; --p2:#ff6b81; --p3:#ffd23f; --p4:#2ee27a;
  --r:16px; --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{background:var(--nuit);color:var(--txt);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;margin:0;padding:0;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.hide{display:none!important}

#ciel{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(125% 68% at 50% 112%, #1d2f66 0%, #111c3c 40%, transparent 74%);
  background-color:#070b18}
#etoiles{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}

#app{position:relative;z-index:1;display:flex;flex-direction:column;
  max-width:540px;margin:0 auto;padding:calc(var(--st) + 10px) 15px calc(88px + var(--sb))}

/* ---------- barre ---------- */
.barre{display:flex;align-items:center;gap:9px;padding:2px 2px 12px}
.marque{font-weight:800;letter-spacing:.15em;font-size:11px;color:var(--txt3);text-transform:uppercase}
.grow{flex:1}
.conn{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt3)}
.pastille{width:7px;height:7px;border-radius:50%;background:var(--txt3);transition:.3s}
.conn[data-s=live] .pastille{background:var(--vert);box-shadow:0 0 8px var(--vert)}
.conn[data-s=wait] .pastille{background:var(--jaune)}
.conn[data-s=off] .pastille{background:var(--rouge)}
.ico{width:33px;height:33px;border-radius:10px;display:grid;place-items:center;background:var(--surf);font-size:15px}
.ico:active{background:var(--surf2)}

/* ---------- entête du jour ---------- */
.jour{text-align:center;padding:2px 0 10px}
.jour .d{font-size:12px;color:var(--txt3);letter-spacing:.05em}
.jour .s{font-size:15px;color:var(--txt2);margin-top:4px}
.jour .s b{color:var(--txt);font-weight:700}

/* ---------- scène / fusée ---------- */
.scene{position:relative;height:172px;margin:2px 0 4px}
.piste{position:absolute;left:50%;transform:translateX(-50%);bottom:26px;top:10px;width:2px;
  background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.02))}
.fusee{position:absolute;left:50%;transform:translateX(-50%);width:52px;transition:bottom 1.2s cubic-bezier(.25,.9,.3,1)}
.fusee svg{display:block;width:100%;filter:drop-shadow(0 0 20px rgba(255,138,43,.5))}
.flamme{transform-origin:50% 0;animation:flam .17s infinite alternate}
@keyframes flam{from{transform:scaleY(.8) scaleX(.92)}to{transform:scaleY(1.15) scaleX(1.05)}}
.alt{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:12px;color:var(--txt3)}
.alt b{color:var(--flamme);font-size:15px;font-weight:800}
.alt .cmp{color:var(--txt3);font-size:11.5px;display:block;margin-top:2px}

/* ---------- carte d'action ---------- */
.act{width:100%;border-radius:22px;padding:19px 18px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#ff9a3c 0%,#ff5a1f 100%);color:#1c0e04;
  box-shadow:0 16px 36px -12px rgba(255,90,24,.6),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .12s}
.act:active{transform:scale(.985)}
.act .kick{font-size:10.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;opacity:.6}
.act .quoi{font-size:21px;font-weight:800;line-height:1.22;margin:7px 0;letter-spacing:-.02em}
.act .geste{font-size:14.5px;font-weight:600;background:rgba(28,14,4,.13);border-radius:11px;padding:9px 11px;margin-top:9px}
.act .geste em{font-style:normal;opacity:.6;font-size:11px;text-transform:uppercase;letter-spacing:.1em;display:block;margin-bottom:2px}
.act .meta{font-size:12.5px;font-weight:700;opacity:.66;margin-top:9px}
.autre{display:block;width:100%;text-align:center;padding:13px;margin-top:8px;font-size:13.5px;color:var(--txt2)}
.autre:active{color:var(--txt)}

/* ---------- blocs génériques ---------- */
.carte{background:var(--surf);border:1px solid var(--bord);border-radius:var(--r);padding:15px;margin-top:12px}
.carte h3{font-size:14.5px;font-weight:700;margin-bottom:5px}
.carte .aide{font-size:13px;color:var(--txt2);line-height:1.5}
.tit{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--txt3);font-weight:700;margin-bottom:8px}
.l{display:flex;gap:8px;font-size:14px;padding:4px 0;color:var(--txt2);align-items:baseline}
.l .ok{color:var(--vert);flex:0 0 auto}
.rien{font-size:13.5px;color:var(--txt3)}

.stats{display:flex;background:var(--surf);border:1px solid var(--bord);border-radius:14px;overflow:hidden;margin-top:10px}
.stats div{flex:1;padding:10px 4px;text-align:center;border-right:1px solid var(--bord)}
.stats div:last-child{border-right:0}
.stats b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.stats span{display:block;font-size:9.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em;margin-top:3px}
.stats .v b{color:var(--vert)} .stats .f b{color:var(--flamme)} .stats .b b{color:var(--bleu)}

.cheer{display:flex;gap:9px;padding:12px 13px;border-radius:13px;margin-top:10px;
  background:linear-gradient(135deg,rgba(255,210,63,.14),rgba(255,210,63,.03));border:1px solid rgba(255,210,63,.26)}
.cheer .qui{font-size:10.5px;color:var(--jaune);font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.cheer .msg{font-size:14.5px;margin-top:2px}

/* ---------- focus ---------- */
#focus{position:fixed;inset:0;z-index:60;background:linear-gradient(180deg,#0b1226,#05070f);
  display:flex;flex-direction:column;padding:calc(var(--st) + 20px) 20px calc(20px + var(--sb));animation:up .3s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
#focus .cat{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--txt3);text-align:center}
#focus .titre{font-size:25px;font-weight:800;line-height:1.22;text-align:center;margin-top:12px;letter-spacing:-.02em}
#focus .sous{text-align:center;font-size:15px;color:var(--flamme);margin-top:10px;font-weight:600;line-height:1.4}
/* discret exprès : présent si le titre est mauvais, invisible sinon */
.fedit{display:block;margin:9px auto 0;font-size:12.5px;color:var(--txt3);padding:5px 10px;border-radius:9px}
.fedit:active{background:var(--surf);color:var(--txt2)}
#focus .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.anneau{position:relative;width:196px;height:196px;display:grid;place-items:center}
.anneau svg{position:absolute;inset:0;transform:rotate(-90deg)}
.anneau circle{fill:none;stroke-width:6;stroke-linecap:round}
.anneau .bg{stroke:rgba(255,255,255,.07)}
.anneau .fg{stroke:url(#gf);transition:stroke-dashoffset .9s linear}
.chrono{font-size:60px;font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums;transition:color .4s}
.chrono.over{color:var(--jaune)}
.chrono small{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);white-space:nowrap;
  font-size:12px;font-weight:600;color:var(--txt3);letter-spacing:.02em}
.anneau{overflow:visible}
.note{margin-top:16px;padding:12px 15px;border-radius:13px;font-size:14px;text-align:center;max-width:330px;line-height:1.45}
.note.gagne{background:rgba(46,226,122,.12);border:1px solid rgba(46,226,122,.35);color:#b6f5d2}
.note.assez{background:rgba(255,210,63,.1);border:1px solid rgba(255,210,63,.3);color:#ffe9a8}
#focus .actions{display:flex;flex-direction:column;gap:9px}
.btn{display:block;width:100%;padding:17px;border-radius:16px;font-weight:700;font-size:17px;text-align:center;transition:transform .1s}
.btn:active{transform:scale(.985)}
.btn.go{background:linear-gradient(135deg,#2ee27a,#10b558);color:#04240f;box-shadow:0 12px 28px -13px rgba(46,226,122,.75)}
.btn.plein{background:linear-gradient(135deg,#ff9a3c,#ff5a1f);color:#1c0e04}
.btn.gris{background:var(--surf);border:1px solid var(--bord);color:var(--txt2);font-size:15px;font-weight:600;padding:14px}

/* ---------- liste ---------- */
/* la recherche : premier élément de l'écran, toujours au même endroit */
.champ.rech{margin-bottom:11px;font-size:15px;padding:12px 14px}
.filtres{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.filtres::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:999px;background:var(--surf);border:1px solid var(--bord);
  font-size:13px;color:var(--txt2);white-space:nowrap}
.chip.on{background:var(--txt);color:var(--nuit);border-color:var(--txt);font-weight:700}
.grp{width:100%;display:flex;align-items:center;gap:9px;padding:13px 13px;margin-top:8px;
  background:var(--surf);border:1px solid var(--bord);border-radius:13px;font-size:14px;font-weight:600}
.grp .pt{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.grp .cpt{margin-left:auto;color:var(--txt3);font-size:12px;font-weight:500}
.grp .fl{color:var(--txt3);font-size:12px;transition:transform .2s}
.grp.ouvert .fl{transform:rotate(90deg)}
.tache{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;margin-top:6px;
  background:var(--surf);border:1px solid var(--bord);border-radius:12px}
.tache:active{background:var(--surf2)}
.tache.faite{opacity:.36}
.tache.faite .txt{text-decoration:line-through}
.case{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:2px solid var(--bord);margin-top:1px;
  display:grid;place-items:center;font-size:12px}
.tache.faite .case{background:var(--vert);border-color:var(--vert);color:#04240f}
.tache .corps{flex:1;min-width:0}
.tache .txt{font-size:14.5px;line-height:1.35}
.tache .ss{font-size:11px;color:var(--txt3);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap}
.tache .go{flex:0 0 auto;align-self:center;padding:7px 10px;border-radius:9px;background:var(--surf2);
  font-size:12px;font-weight:800;color:var(--flamme)}

/* ---------- ce soir ---------- */
.slot{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:13px;margin-top:8px;
  border:1.5px dashed var(--bord);color:var(--txt3);font-size:14px;width:100%}
.slot.plein{border-style:solid;border-color:rgba(255,138,43,.38);background:rgba(255,138,43,.07);color:var(--txt)}
.slot .num{width:21px;height:21px;border-radius:50%;background:var(--surf2);display:grid;place-items:center;
  font-size:11px;font-weight:800;flex:0 0 auto;margin-top:1px}
.slot .cn{flex:1;min-width:0;cursor:pointer}
.slot .qd{font-size:12px;color:var(--flamme);margin-top:3px}
.slot .gs{font-size:12.5px;color:var(--txt2);margin-top:2px}
.slot .manque{font-size:12px;color:var(--jaune);margin-top:3px}
.slot .x{color:var(--txt3);padding:0 3px;font-size:19px;flex:0 0 auto}
/* la case à cocher d'un créneau : même geste que dans la liste */
.slot .case{margin-top:0}
.slot.faite{border-color:rgba(46,226,122,.34);background:rgba(46,226,122,.07)}
.slot.faite .case{background:var(--vert);border-color:var(--vert);color:#04240f}
.slot.faite .cn{text-decoration:line-through;opacity:.55}
/* depuis quand elle attend — un fait, pas un reproche */
.depuis{font-size:11.5px;color:var(--txt2);margin-top:3px}
.depuis b{color:var(--jaune);font-weight:700}
.script{background:#05070f;border:1px solid var(--bord);border-radius:12px;padding:14px;margin-top:11px;
  font-size:14.5px;line-height:1.6}
.script .c{color:var(--flamme);font-weight:700}
.appr{background:rgba(46,226,122,.1);border:1px solid rgba(46,226,122,.3);border-radius:12px;
  padding:11px 13px;margin-top:10px;font-size:13.5px;color:#b6f5d2}

/* ---------- choix de durée / pile ---------- */
.durs{display:flex;flex-wrap:wrap;gap:7px}
.dur{padding:9px 13px;border-radius:11px;background:#05070f;border:1px solid var(--bord);
  font-size:13.5px;color:var(--txt2)}
.dur.on{background:var(--flamme);border-color:var(--flamme);color:#1c0e04;font-weight:700}

/* ---------- graphique de montée ---------- */
.hero{font-size:62px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:4px 0 6px;
  background:linear-gradient(180deg,#fff,#9fb2e8);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero small{font-size:24px;font-weight:700;letter-spacing:0}
.gwrap{position:relative;margin-top:4px}
.gwrap svg{display:block;width:100%;height:150px;touch-action:pan-y}
.gwrap .zn{cursor:crosshair}
.glab{display:flex;gap:13px;align-items:center;font-size:11.5px;color:var(--txt2);margin-top:7px;flex-wrap:wrap}
.glab .k{display:inline-block;width:9px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.gtip{position:absolute;left:0;right:0;top:-4px;text-align:center;font-size:12px;color:var(--txt);
  background:#161f3c;border:1px solid var(--bord);border-radius:9px;padding:6px 9px;
  opacity:0;transition:.15s;pointer-events:none}
.gtip.on{opacity:1}
.gt{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px;font-variant-numeric:tabular-nums}
.gt th{text-align:left;color:var(--txt3);font-weight:600;padding:5px 4px;border-bottom:1px solid var(--bord);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.gt td{padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.045);color:var(--txt2)}
.gt td:first-child{color:var(--txt)}
.cross{pointer-events:none}
/* le rythme jour par jour, sous la courbe : une échelle à lui, donc lisible
   même quand la montée globale est encore un trait plat */
.gbars svg{display:block;width:100%;height:54px;margin-top:2px}

/* ---------- série de journées pleines ----------
   Le chiffre qu'il vient chercher : gros, chaud, impossible à manquer. */
.streak{position:relative;overflow:hidden;margin-top:12px;padding:17px 16px 14px;border-radius:20px;text-align:center;
  background:linear-gradient(150deg,rgba(255,138,43,.22),rgba(255,90,24,.05));border:1px solid rgba(255,138,43,.42);
  box-shadow:0 14px 34px -20px rgba(255,90,24,.8)}
.streak .feu{font-size:25px;line-height:1;filter:drop-shadow(0 0 14px rgba(255,138,43,.7))}
.streak .n{font-size:58px;font-weight:800;line-height:.98;letter-spacing:-.045em;margin-top:2px;
  background:linear-gradient(180deg,#ffe08a,#ff5a1f);-webkit-background-clip:text;background-clip:text;color:transparent}
.streak .lab{font-size:14.5px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.streak .sous{font-size:12px;color:var(--txt2);margin-top:4px;line-height:1.45}
.streak.vide{background:var(--surf);border-color:var(--bord);box-shadow:none}
.streak.vide .n{font-size:38px;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--txt3)}
/* la réserve de jetons, sous la série : des pastilles, pas un compte à rebours */
.jetons{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;
  margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.11);font-size:12.5px;color:var(--txt2)}
.jetons .pastilles{display:flex;gap:4px}
.jeton{width:10px;height:10px;border-radius:50%;background:var(--bleu);box-shadow:0 0 9px rgba(94,200,255,.6)}
.jeton.off{background:rgba(255,255,255,.14);box-shadow:none}
.jetons b{color:var(--bleu);font-weight:800}

/* ---------- ce que le témoin ne voit pas ---------- */
.lock{color:var(--bleu);font-size:11px;font-weight:700}
.reve .lock{flex:0 0 auto}
/* masquer en un seul geste, depuis la ligne elle-même */
.lk{flex:0 0 auto;align-self:center;width:31px;height:31px;border-radius:10px;display:grid;place-items:center;
  font-size:13px;background:var(--surf2);opacity:.5;transition:.15s}
.lk.on{opacity:1;background:rgba(94,200,255,.20);box-shadow:inset 0 0 0 1px rgba(94,200,255,.35)}
.lk:active{transform:scale(.9)}
/* couper une tâche en morceaux : le geste qui débloque, donc toujours à portée */
.lk.cut{color:var(--flamme);opacity:.72}
.lk.cut:active{background:rgba(255,138,43,.2)}

/* ---------- pourquoi ---------- */
.reve{border-radius:var(--r);padding:15px;margin-top:11px;background:var(--surf);border:1px solid var(--bord)}
.reve .h{display:flex;align-items:center;gap:10px}
.reve .e{font-size:24px}
.reve .n{font-size:16.5px;font-weight:800;flex:1;letter-spacing:-.01em}
.reve .pct{font-size:12px;color:var(--txt3);font-weight:700}
.jauge{height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin:11px 0 3px;overflow:hidden}
.jauge i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff9a3c,#2ee27a);transition:width .9s}
.reve .q{font-size:14px;color:var(--txt2);line-height:1.5;margin-top:9px}
.reve .pq{font-size:14px;line-height:1.5;margin-top:9px;padding-left:11px;border-left:2px solid var(--flamme);color:var(--txt)}
.reve .ed{font-size:12px;color:var(--txt3);margin-top:10px}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;
  padding:6px 8px calc(6px + var(--sb));background:rgba(7,11,24,.88);backdrop-filter:blur(18px);border-top:1px solid var(--bord)}
nav button{flex:1;max-width:120px;padding:7px 2px;border-radius:12px;text-align:center;color:var(--txt3);
  font-size:9.5px;letter-spacing:.04em;font-weight:600;position:relative}
nav button .e{display:block;font-size:19px;margin-bottom:2px;filter:grayscale(1) opacity(.5)}
nav button.on{color:var(--txt)} nav button.on .e{filter:none}
nav .pip{position:absolute;top:3px;right:16%;width:7px;height:7px;border-radius:50%;background:var(--flamme)}

/* ---------- divers ---------- */
.toast{position:fixed;left:50%;bottom:calc(100px + var(--sb));transform:translate(-50%,14px);z-index:96;
  background:#161f3c;border:1px solid var(--bord);border-radius:12px;padding:11px 16px;font-size:14px;
  opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center;box-shadow:0 14px 32px -14px #000;
  display:flex;align-items:center;gap:12px;justify-content:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* un toast qui porte une action reste cliquable : c'est le filet de sécurité
   d'une case cochée par erreur */
.toast.agir{pointer-events:auto}
.toast .undo{flex:0 0 auto;padding:6px 11px;border-radius:9px;background:var(--surf2);
  border:1px solid var(--bord);font-size:13px;font-weight:700;color:var(--flamme)}
.toast .undo:active{background:rgba(255,138,43,.2)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(4,6,15,.74);backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center}
.feuille{width:100%;max-width:540px;background:#0d1428;border:1px solid var(--bord);border-bottom:0;
  border-radius:22px 22px 0 0;padding:20px 17px calc(22px + var(--sb));animation:up .26s ease;max-height:92vh;overflow:auto}
.feuille h3{font-size:18px;margin-bottom:10px}
.champ{width:100%;padding:13px;border-radius:12px;background:#05070f;border:1px solid var(--bord);
  color:var(--txt);font-size:16px;margin-bottom:9px;resize:vertical}
.champ:focus{outline:none;border-color:var(--flamme)}

<!-- Les données personnelles ne sont PAS dans ce dépôt public : elles vivent
     uniquement dans ta base, sous un identifiant de salon de 128 bits.
     Ces deux fichiers n'existent qu'en local, sur ton portable, comme
     sauvegarde et comme moyen de tout réimporter si besoin. -->
<script src="taches.js" onerror="window.SEED_ABSENT=1"></script>
<script src="reves.js" onerror="window.REVES_ABSENT=1"></script>
<script>
(function(){
"use strict";

/* ============================================================
   RÉGLAGES
   ============================================================ */
var DB="https://feuille-de-route-1914c-default-rtdb.firebaseio.com";
var K_ROOM="dec-room", K_SON="dec-son", K_QUI="dec-qui";
var CIBLE_JOUR=3;        /* 3 gestes/jour = altitude pleine */
var GESTE_SEC=120;       /* le geste d'entrée : 2 minutes */
var JETON_SEMAINE=1;     /* un jeton gagné par semaine, qui s'accumule */

/* ============================================================
   OUTILS
   ============================================================ */
function el(i){ return document.getElementById(i); }
function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; }
function pad(x){ return String(x).padStart(2,"0"); }
function now(){ return Date.now(); }
function iso(d){ d=d||new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function isoPlus(s,n){ var p=s.split("-"); return iso(new Date(+p[0],+p[1]-1,+p[2]+n)); }
function joursEntre(a,b){ return Math.round((Date.parse(b+"T00:00:00")-Date.parse(a+"T00:00:00"))/864e5); }
function lundi(s){ var p=(s||iso()).split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]);
  var j=(d.getDay()+6)%7; d.setDate(d.getDate()-j); return iso(d); }
function labelJour(s){ var p=s.split("-"); var t=new Date(+p[0],+p[1]-1,+p[2])
  .toLocaleDateString("fr-CA",{weekday:"long",day:"numeric",month:"long"}); return t.charAt(0).toUpperCase()+t.slice(1); }
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
function rid(n){ var a=new Uint8Array(n||8); crypto.getRandomValues(a);
  return Array.prototype.map.call(a,function(b){ return pad(b.toString(16)); }).join(""); }
function hm(m){ if(m<60) return m+" min"; var h=Math.floor(m/60), r=m%60; return h+" h"+(r?" "+pad(r):""); }
/* chercher « electro » doit trouver « électros » : on compare sans accents */
function sansAccents(s){
  return (s||"").toLowerCase()
    .replace(/[àâä]/g,"a").replace(/[éèêë]/g,"e").replace(/[îï]/g,"i")
    .replace(/[ôö]/g,"o").replace(/[ùûü]/g,"u").replace(/ç/g,"c");
}
/* Une tâche correspond si le mot est dans son titre, sa catégorie, ou le titre
   du chantier qui la contient — sinon chercher « électros » ne remonterait
   aucune de ses étapes. */
function correspond(x,f){
  if(!f) return true;
  var p=x.parent?T()[x.parent]:null;
  return sansAccents(x.t).indexOf(f)>=0
      || sansAccents(x.c).indexOf(f)>=0
      || (p&&sansAccents(p.t).indexOf(f)>=0);
}
function toast(m){ var t=el("toast"); t.textContent=m; t.classList.remove("agir"); t.classList.add("on");
  clearTimeout(toast._h); toast._h=setTimeout(function(){t.classList.remove("on");},2800); }
/* Un toast qui porte un bouton. Sert au « annuler » qui suit chaque cochage :
   une case cochée par erreur doit se défaire là où on vient de la cocher,
   pas dans un filtre qu'il faut d'abord découvrir. */
function toastAction(m,label,fn,ms){
  var t=el("toast");
  t.innerHTML='<span>'+esc(m)+'</span><button class="undo" id="tUndo">'+esc(label)+'</button>';
  t.classList.add("on","agir");
  var b=el("tUndo");
  if(b) b.onclick=function(){ t.classList.remove("on","agir"); fn(); };
  clearTimeout(toast._h);
  toast._h=setTimeout(function(){ t.classList.remove("on","agir"); },ms||7000);
}
function vibre(p){ try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} }

/* ============================================================
   ÉTAT
   ============================================================ */
var db={ tasks:{}, gestes:{}, jours:{}, semaines:{}, reves:{}, cheers:{}, boite:{}, jetons:{}, live:{}, meta:{} };
/* `maman` = la page a été ouverte par le lien de partage. Mêmes droits que
   Lucas, plus l'écran de suivi. Le nom est resté celui du premier usage. */
var room, maman=false, vue="maintenant", filtre="tout", ouverts={}, propose=null, tick=null;
var recherche="";

function T(){ return db.tasks||(db.tasks={}); }

/* ============================================================
   RÉSEAU — REST + flux SSE natif de Firebase
   ============================================================ */
function url(p){ return DB.replace(/\/+$/,"")+"/rooms/"+room+(p||"")+".json"; }
function setConn(s,t){ var c=el("conn"); c.dataset.s=s;
  el("connTxt").textContent=t||(s==="live"?"en direct":s==="wait"?"connexion…":"hors ligne"); }

async function ecrire(m,p,b){
  try{
    var r=await fetch(url(p),{method:m,headers:{"Content-Type":"application/json"},
      body:JSON.stringify(b===undefined?null:b)});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return true;
  }catch(e){ toast("Pas enregistré — vérifie ta connexion."); return false; }
}
function patch(p,o){ return ecrire("PATCH",p,o); }
function put(p,v){ return ecrire("PUT",p,v); }
/* renvoie la clé créée : c'est ce qui permet de défaire un geste enregistré
   par erreur, sans quoi l'altitude compterait un geste fantôme */
function pousser(n,o){ var k=rid(6), w={}; w[k]=o;
  return patch("/"+n,w).then(function(){ return k; }); }

function appliquer(type,path,data){
  if(type!=="put"&&type!=="patch") return;
  var parts=path.split("/").filter(Boolean);
  if(!parts.length){
    if(type==="put") db=data||{};
    else Object.keys(data||{}).forEach(function(k){ if(data[k]===null) delete db[k]; else db[k]=data[k]; });
    normaliser(); return;
  }
  var c=db;
  for(var i=0;i<parts.length-1;i++){
    if(c[parts[i]]==null||typeof c[parts[i]]!=="object") c[parts[i]]={};
    c=c[parts[i]];
  }
  var last=parts[parts.length-1];
  if(type==="put"){ if(data===null) delete c[last]; else c[last]=data; }
  else{
    if(c[last]==null||typeof c[last]!=="object") c[last]={};
    Object.keys(data||{}).forEach(function(k){ if(data[k]===null) delete c[last][k]; else c[last][k]=data[k]; });
  }
}
function normaliser(){
  ["tasks","gestes","jours","semaines","reves","cheers","boite","jetons","live","meta"]
    .forEach(function(k){ if(!db[k]||typeof db[k]!=="object") db[k]={}; });
}

function morceau(ch){
  var type=null, ln=[];
  ch.split("\n").forEach(function(l){
    if(l.indexOf("event:")===0) type=l.slice(6).trim();
    else if(l.indexOf("data:")===0) ln.push(l.slice(5).trim());
  });
  if(!type) return;
  setConn("live");
  if(type==="keep-alive") return;
  if(type==="auth_revoked"||type==="cancel") throw new Error("flux interrompu");
  var raw=ln.join("\n"); if(!raw) return;
  var p; try{ p=JSON.parse(raw); }catch(e){ return; }
  appliquer(type,p.path||"/",p.data);
  planifier();
}

var backoff=1000, ctl=null;
async function connecter(){
  if(ctl) ctl.abort();
  ctl=new AbortController(); setConn("wait");
  try{
    var res=await fetch(url(),{headers:{"Accept":"text/event-stream"},signal:ctl.signal,cache:"no-store"});
    if(!res.ok||!res.body) throw new Error("HTTP "+res.status);
    setConn("live"); backoff=1000;
    var rd=res.body.getReader(), dec=new TextDecoder(), buf="";
    for(;;){
      var o=await rd.read(); if(o.done) break;
      buf+=dec.decode(o.value,{stream:true});
      var i;
      while((i=buf.indexOf("\n\n"))>=0){ var c=buf.slice(0,i); buf=buf.slice(i+2); morceau(c); }
    }
    throw new Error("flux fermé");
  }catch(e){
    if(e.name==="AbortError") return;
    setConn("off"); backoff=Math.min(backoff*1.8,20000); setTimeout(connecter,backoff);
  }
}

/* ============================================================
   GRAINE
   ============================================================ */
async function semer(){
  if(typeof SEED==="undefined"||typeof REVES==="undefined") return;
  var t=T(), aj={}, n=0;
  SEED.forEach(function(s){
    if(t[s.id]) return;
    aj[s.id]={ t:s.t, c:s.c, p:s.p, m:s.m, ct:now(), fait:s.fait?now():null, reports:0 };
    n++;
  });
  if(n) await patch("/tasks",aj);

  var r=db.reves||{}, ar={}, nr=0;
  REVES.forEach(function(s){
    if(r[s.id]) return;
    ar[s.id]={ e:s.e, nom:s.nom, quoi:s.quoi, pourquoi:s.pourquoi, taches:s.taches||[] };
    nr++;
  });
  if(nr) await patch("/reves",ar);

  await patch("/meta",{ seed:SEED_VERSION, reves:REVES_VERSION, debut:(db.meta&&db.meta.debut)||now() });
}

/* ============================================================
   CALCULS
   ============================================================ */
/* ---------- CE QUE LE TÉMOIN NE VOIT PAS ----------
   Le drapeau `prive` retire une tâche (et ses étapes) ou un projet de la page
   quand elle est ouverte par le lien de partage.

   À dire franchement, parce que ça compte : c'est un rideau, pas un coffre.
   Qui possède l'identifiant du salon peut interroger la base directement et
   lire ce qu'il veut. Ça protège d'un regard par-dessus l'épaule, pas de
   quelqu'un qui cherche. Pour un vrai mur il faudrait un second salon.

   Un seul point de filtrage — `liste()` et `gestes()` — pour qu'aucun écran
   ne puisse laisser passer ce qui est caché en oubliant de filtrer. */
function priveeX(x){
  if(!x) return false;
  if(x.prive) return true;
  if(x.parent){ var p=T()[x.parent]; if(p&&p.prive) return true; }
  return false;
}
function masquee(x){ return maman&&priveeX(x); }
/* Une tâche que la page a le droit d'afficher, par son identifiant. */
function visibleId(id){ var x=T()[id]; return !!x&&!masquee(x); }
/* La tâche en cours s'affiche en plein écran : si elle est cachée, l'écran de
   focus et le suivi doivent se taire tous les deux. */
function liveMasque(){
  var L=db.live;
  return !!(L&&L.id&&maman&&T()[L.id]&&priveeX(T()[L.id]));
}

function liste(){
  var t=T();
  return Object.keys(t).map(function(k){ var x=Object.assign({},t[k]); x.id=k; return x; })
    .filter(function(x){ return x&&x.t&&!masquee(x); });
}
/* Trois sorties possibles pour une tâche, et elles ne se valent pas :
   - faite    : tu l'as faite. Ça compte.
   - annulée  : elle ne s'applique plus. Elle disparaît, sans aucun crédit.
   - restante : elle attend.
   Confondre les deux premières rendrait tous les chiffres faux. */
function restantes(){ return liste().filter(function(x){ return !x.fait&&!x.annule; }); }
function faites(){ return liste().filter(function(x){ return x.fait&&!x.annule; }); }
function annulees(){ return liste().filter(function(x){ return x.annule; }); }

/* Un chantier est une tâche qui ne se coche pas : elle se découpe.
   On ne la propose jamais comme action — on propose ses étapes. */
function estChantier(x){ return !!x.chantier; }
function etapes(id){ return restantes().filter(function(x){ return x.parent===id; }); }
function etapesToutes(id){ return liste().filter(function(x){ return x.parent===id&&!x.annule; }); }
function avanceChantier(id){
  var t=etapesToutes(id); if(!t.length) return null;
  return { fait:t.filter(function(x){ return x.fait; }).length, total:t.length };
}
/* Les étapes vivent dans leur chantier : elles n'encombrent pas la liste principale. */
function racines(){ return restantes().filter(function(x){ return !x.parent; }); }
/* Les tâches cochées pendant un ménage portent « vieux » : elles comptent dans le
   total de ce qui est réglé, jamais dans le travail du jour — sinon le bilan du
   soir et la page du témoin raconteraient une journée qui n'a pas eu lieu. */
function faitesLe(d){ return faites().filter(function(x){ return !x.vieux&&iso(new Date(x.fait))===d; }); }

/* Un geste porte le titre de sa tâche : si la tâche est cachée au témoin,
   le geste l'est aussi, sinon le titre réapparaîtrait dans son fil. */
function gestes(){ var g=db.gestes||{};
  return Object.keys(g).map(function(k){ return g[k]; })
    .filter(function(x){ return x&&x.ts&&!(maman&&x.id&&T()[x.id]&&priveeX(T()[x.id])); }); }
function gestesLe(d){ return gestes().filter(function(x){ return iso(new Date(x.ts))===d; }); }
function gestesSemaine(l){ var n=0;
  for(var i=0;i<7;i++) n+=gestesLe(isoPlus(l,i)).length; return n; }

/* Altitude : 14 jours pondérés. Descend doucement, ne tombe jamais à zéro.
   Les journées blanches (jetons) ne pénalisent pas. */
function altitude(){
  var a=iso(), s=0, p=0;
  /* On ne compte pas comme « vides » les jours d'avant l'installation : la
     fenêtre s'ouvre progressivement (plancher de 5 jours pour rester lisse). */
  var debut=(db.meta&&db.meta.debut)?iso(new Date(db.meta.debut)):a;
  var age=Math.max(0,-joursEntre(a,debut));
  var fen=Math.min(14,age+1);
  for(var j=0;j<fen;j++){
    var d=isoPlus(a,-j), w=Math.pow(0.87,j);
    var n=gestesLe(d).length;
    var blanc=(db.jours||{})[d]&&(db.jours||{})[d].blanc;
    if(blanc&&!n) n=CIBLE_JOUR*0.6;
    s+=Math.min(n,CIBLE_JOUR*1.6)*w; p+=CIBLE_JOUR*w;
  }
  return Math.max(0,Math.min(100,Math.round(s/p*100)));
}

/* Rebond : jours sans geste suivis d'une reprise sous 48 h.
   C'est la compétence qui lui manque — donc celle qu'on met en avant. */
function rebonds(){
  /* Uniquement depuis le premier jour d'utilisation : compter des « rebonds »
     sur des journées antérieures à l'outil produirait un chiffre faux, et cet
     écran ne vaut que s'il ne dit que des faits. */
  var a=iso(), n=0;
  var debut=(db.meta&&db.meta.debut)?iso(new Date(db.meta.debut)):a;
  for(var j=1;j<180;j++){
    var d=isoPlus(a,-j);
    if(d<=debut) break;
    if(gestesLe(d).length) continue;
    if(gestesLe(isoPlus(d,1)).length||gestesLe(isoPlus(d,2)).length) n++;
  }
  return n;
}
function meilleureSemaine(){
  var l=lundi(), best=0;
  for(var k=0;k<26;k++){ var n=gestesSemaine(isoPlus(l,-7*k)); if(n>best) best=n; }
  return best;
}
/* ============================================================
   LA MONTAGNE — combien de travail il reste, en minutes

   Un seul chiffre compte : quelle part du total est réglée.
   Les chantiers ne comptent pas pour eux-mêmes (leurs étapes le
   font déjà), sauf tant qu'ils ne sont pas découpés.
   ============================================================ */
function comptable(x){
  if(estChantier(x)) return etapesToutes(x.id).length===0;
  return true;
}
function minutesDe(l){ var s=0; l.forEach(function(x){ s+=(x.m||15); }); return s; }

function montagne(){
  var l=liste().filter(function(x){ return !x.annule&&comptable(x); });
  var f=l.filter(function(x){ return x.fait; });
  var total=minutesDe(l), fait=minutesDe(f);
  return { total:total, fait:fait, reste:total-fait,
           pct: total? Math.round(fait/total*100) : 0 };
}

/* Série jour par jour, reconstruite depuis les dates des tâches.
   Rien n'est journalisé : tout se recalcule, donc rien ne peut mentir. */
function serieJours(){
  var l=liste().filter(comptable);
  var debut=null;
  l.forEach(function(x){ if(x.ct&&(!debut||x.ct<debut)) debut=x.ct; });
  if(db.meta&&db.meta.debut&&(!debut||db.meta.debut<debut)) debut=db.meta.debut;
  if(!debut) return [];
  var d0=iso(new Date(debut)), a=iso(), n=Math.min(120,Math.max(0,joursEntre(d0,a)));
  var out=[];
  for(var i=0;i<=n;i++){
    var j=isoPlus(d0,i), fin=Date.parse(j+"T23:59:59");
    var cible=0, fait=0;
    l.forEach(function(x){
      var ne=(x.ct||0)<=fin;
      var vivante=!x.annule||x.annule>fin;
      if(ne&&vivante){
        cible+=(x.m||15);
        if(x.fait&&x.fait<=fin) fait+=(x.m||15);
      }
    });
    out.push({ j:j, cible:cible, fait:fait });
  }
  return out;
}

function avancementReve(r){
  var t=(r.taches||[]).filter(function(id){ return T()[id]; });
  if(!t.length) return null;
  var f=t.filter(function(id){ return T()[id].fait; }).length;
  /* avance offerte : définir le projet, c'est déjà du travail (Nunes & Drèze 2006) */
  return Math.min(100, Math.round(15+ (f/t.length)*85));
}

function toucheeAuj(id){
  return gestesLe(iso()).some(function(g){ return g.id===id; });
}
function scorer(x){
  return (5-(x.p||4))*26 + Math.max(0,40-(x.m||15))*0.55 + Math.min(x.reports||0,8)*9
    /* déjà touchée aujourd'hui : on passe à autre chose plutôt que de tourner en rond */
    - (toucheeAuj(x.id)?200:0);
}
/* Ce qu'on peut réellement proposer : les tâches ordinaires, les étapes des
   chantiers, et les chantiers pas encore découpés — pour lesquels l'action
   proposée est justement de les découper. */
function candidats(){
  return restantes().filter(function(x){
    return estChantier(x) ? etapes(x.id).length===0 : true;
  });
}
function prochaines(n){
  var r=candidats(); if(!r.length) return [];
  r.sort(function(a,b){ return scorer(b)-scorer(a); });
  return r.slice(0,n||5);
}
function tirer(){
  var t=prochaines(5); if(!t.length) return null;
  return t[Math.floor(Math.random()*Math.min(3,t.length))];
}
function planDuJour(){
  var j=(db.jours||{})[iso()]||{};
  return (j.plan||[]).filter(function(id){ return visibleId(id)&&!T()[id].fait&&!T()[id].annule; })
    .map(function(id){ var x=Object.assign({},T()[id]); x.id=id; return x; });
}

/* ---------- LES TÂCHES PRÉVUES QUI N'ONT PAS ÉTÉ FAITES ----------
   Une tâche que tu avais prévue pour un jour donné ne s'évapore pas le
   lendemain : elle glisse dans le plan du jour et garde la date à laquelle tu
   l'avais prévue, ce qui permet de dire depuis quand elle attend.

   Le plafond de trois tient quand même. Au-delà, les plus anciennes prennent
   les places et les autres reviennent dès qu'une place se libère : jamais un
   plan de sept lignes le matin, jamais une tâche perdue non plus. */
function attendDepuis(x){
  if(!x||!x.prevu||x.fait||x.annule) return 0;
  return Math.max(0,joursEntre(x.prevu,iso()));
}
async function reporterPlans(){
  var a=iso(), plan=(((db.jours||{})[a]||{}).plan||[]).slice(), bouge=false;
  /* une tâche déjà inscrite pour un jour à venir n'est pas en retard : tu l'as
     replacée toi-même. La reporter en plus produirait un doublon à l'écran. */
  var futurs={};
  Object.keys(db.jours||{}).forEach(function(d){
    if(d>a) (((db.jours[d]||{}).plan)||[]).forEach(function(id){ futurs[id]=1; });
  });
  liste()
    .filter(function(x){ return !x.fait&&!x.annule&&x.prevu&&x.prevu<a&&plan.indexOf(x.id)<0&&!futurs[x.id]; })
    .sort(function(p,q){ return p.prevu<q.prevu?-1:p.prevu>q.prevu?1:0; })
    .forEach(function(x){ if(plan.length<3){ plan.push(x.id); bouge=true; } });
  if(bouge){ await put("/jours/"+a+"/plan",plan); (db.jours||{})[a]=Object.assign({},(db.jours||{})[a],{plan:plan}); }
}

/* ---------- LA SÉRIE DE JOURNÉES PLEINES ----------
   Un jour compte quand le plan de ce jour-là portait trois tâches et que les
   trois sont tombées avant la fin de la journée.

   Un jour manqué ne remet pas tout à zéro : il consomme une des journées
   blanches du mois, exactement comme ailleurs dans l'app. Deux jours manqués
   d'affilée arrêtent la série — sans ça, elle ne voudrait plus rien dire. */
function jourPlein(d){
  var p=(((db.jours||{})[d]||{}).plan)||[];
  if(p.length<3) return false;
  var fin=Date.parse(d+"T23:59:59");
  return p.every(function(id){
    var x=T()[id]; return !!x&&!x.annule&&!!x.fait&&x.fait<=fin;
  });
}
function premierJour(){
  var a=iso();
  return (db.meta&&db.meta.debut)?iso(new Date(db.meta.debut)):a;
}
/* La série ne devine rien : elle lit les journées blanches déjà posées par les
   jetons. Un jour qui n'est ni plein ni blanc l'arrête, point. */
function serie(){
  var a=iso(), debut=premierJour(), n=0, blanches=0, attente=0;
  /* la journée en cours ne peut rien casser : elle n'est pas finie */
  if(jourPlein(a)) n=1;
  var d=isoPlus(a,-1);
  for(var i=0;i<400;i++){
    if(d<debut) break;
    if(jourPlein(d)){
      /* une blanche ne se compte qu'une fois qu'elle a servi à relier deux
         jours pleins ; celle qui précède le début de la série n'a rien
         absorbé et ne doit pas apparaître */
      n++; blanches+=attente; attente=0;
    }
    else if(((db.jours||{})[d]||{}).blanc) attente++;
    else break;
    d=isoPlus(d,-1);
  }
  return { n:n, blanches:blanches };
}
function meilleureSerie(){
  var a=iso(), d=premierJour(), suite=[];
  for(var i=0;i<400&&d<=a;i++){
    suite.push(jourPlein(d)?1:(((db.jours||{})[d]||{}).blanc?0:-1));
    d=isoPlus(d,1);
  }
  var best=0, cur=0;
  suite.forEach(function(v){
    if(v===1){ cur++; if(cur>best) best=cur; }
    else if(v===-1) cur=0;
  });
  return best;
}

/* ---------- LES JETONS ----------
   Un jeton gagné par semaine, ajouté au total : ils s'accumulent, ils ne se
   remettent pas à zéro. Un jeton part tout seul le jour où tes trois tâches
   ne sont pas toutes tombées — la journée devient blanche, ta série tient et
   ton altitude ne bouge pas. Sans jeton en réserve, la série s'arrête.

   Chaque journée terminée est réglée une seule fois : `meta.jetonsAu` retient
   jusqu'où on est allé, donc rouvrir l'app dix fois ne consomme rien de plus.
   Rien n'est demandé, rien n'est à confirmer : ça se fait en silence. */
function jetonsReste(){ return Math.max(0,((db.jetons||{}).reste)||0); }

async function reglerJetons(){
  var a=iso(), l=lundi(a), debut=premierJour(), jt=db.jetons||{};

  /* le crédit hebdomadaire, rattrapé même si l'app est restée fermée un mois */
  if(!jt.semaine||jt.semaine>l){
    jt={ semaine:l, reste:(jt.reste!=null?jt.reste:JETON_SEMAINE) };
    await put("/jetons",jt); db.jetons=jt;
  }
  else if(jt.semaine<l){
    var sem=Math.round(joursEntre(jt.semaine,l)/7);
    if(sem>0){
      jt={ semaine:l, reste:(jt.reste||0)+sem*JETON_SEMAINE };
      await put("/jetons",jt); db.jetons=jt;
    }
  }

  /* Les journées terminées, une par une, jamais celle en cours.
     Au tout premier passage on part d'aujourd'hui : juger après coup des
     journées d'avant l'existence de cette règle viderait la réserve d'un coup
     pour des jours où il n'y avait rien à respecter. */
  var d=(db.meta&&db.meta.jetonsAu)||a;
  if(d<isoPlus(debut,1)) d=isoPlus(debut,1);
  var reste=jetonsReste(), pris=[];
  for(var i=0;i<400&&d<a;i++){
    var jr=(db.jours||{})[d]||{};
    if(!jourPlein(d)&&!jr.blanc&&reste>0){ pris.push(d); reste--; }
    d=isoPlus(d,1);
  }
  if(pris.length){
    var w={}; pris.forEach(function(k){ w[k+"/blanc"]=1; });
    await patch("/jours",w);
    pris.forEach(function(k){ db.jours[k]=Object.assign({},db.jours[k],{blanc:1}); });
    await patch("/jetons",{reste:reste}); db.jetons.reste=reste;
  }
  if(!db.meta||db.meta.jetonsAu!==d){ await patch("/meta",{jetonsAu:d}); if(db.meta) db.meta.jetonsAu=d; }
}

async function demarrer(x){
  if(!x) return;
  await put("/live",{ id:x.id, t:x.t, c:x.c, m:x.m||15, geste:x.geste||"", debut:now(), phase:"geste" });
  rendre();
}
async function marquerGeste(x,sec){
  return await pousser("gestes",{ ts:now(), id:x.id, t:x.t, sec:Math.round(sec||GESTE_SEC) });
}

/* ---------- DÉFAIRE UN COCHAGE ----------
   Cocher est un geste à un doigt : il part tout seul. Il faut donc pouvoir le
   défaire là où il a été fait, tout de suite, sans aller chercher un filtre.
   On remet la tâche dans la liste, on efface le geste qu'elle a créé, et on
   rouvre le chantier qu'elle avait refermé en tombant. */
async function decocher(id,cleGeste){
  var x=T()[id]; if(!x) return;
  x.fait=null; if(x.vieux) x.vieux=null;
  await patch("/tasks/"+id,{fait:null,vieux:null});
  if(cleGeste){
    await put("/gestes/"+cleGeste,null);
    if(db.gestes) delete db.gestes[cleGeste];
  }
  /* si sa chute avait refermé un chantier — et éventuellement le chantier
     au-dessus — on remonte toute la chaîne pour les rouvrir */
  var cur=x, garde=0;
  while(cur&&cur.parent&&garde++<12){
    var p=T()[cur.parent];
    if(p&&p.fait){ p.fait=null; await patch("/tasks/"+cur.parent,{fait:null}); }
    cur=p;
  }
  vibre(10);
  toast("Remise dans la liste.");
  rendre();
}
/* Quand la dernière étape d'un chantier tombe, le chantier se ferme tout seul :
   il n'y a rien de plus démoralisant qu'un projet fini qui traîne encore. */
async function fermerParent(x){
  if(!x||!x.parent) return null;
  var p=T()[x.parent]; if(!p||p.fait) return null;
  var reste=etapesToutes(x.parent).filter(function(e){ return !e.fait&&e.id!==x.id; });
  if(reste.length) return null;
  var t=now();
  await patch("/tasks/"+x.parent,{fait:t});
  /* On applique tout de suite en local : l'écho du flux peut arriver après,
     et l'écran ne doit pas afficher un chantier ouvert qui vient de fermer. */
  if(T()[x.parent]) T()[x.parent].fait=t;
  var o=Object.assign({},p); o.id=x.parent;
  /* un chantier peut lui-même être l'étape d'un chantier plus grand : on
     remonte tant que la dernière pièce tombe, et on annonce le plus haut */
  var haut=await fermerParent(o);
  return haut||o;
}

async function terminer(x,min){
  if(!x) return;
  var maj={fait:now()}; if(min!=null) maj.passe=Math.round(min);
  /* la récompense part avant le réseau : la faire attendre deux allers-retours,
     c'est la décrocher du geste qui l'a méritée */
  if(T()[x.id]) T()[x.id].fait=maj.fait;
  celebrer(x,true);
  await patch("/tasks/"+x.id,maj);
  await put("/live",null);
  var p=await fermerParent(x);
  rendre();
  setTimeout(function(){
    if(p){ celebrer(p,true); toast("Chantier terminé : "+p.t); }
    else toastAction("Réglé.","annuler",function(){ decocher(x.id,null); });
  },1800);
  if(p) setTimeout(function(){
    toastAction("Réglé.","annuler",function(){ decocher(x.id,null); });
  },3600);
}
async function stopper(x,gagne){
  await put("/live",null);
  if(gagne) celebrer(x,false);
  propose=null;
  rendre();
}
async function reporter(x){
  if(x) await patch("/tasks/"+x.id,{reports:(x.reports||0)+1});
  await put("/live",null); propose=null; rendre();
}
async function basculer(x){
  if(x.fait){ await patch("/tasks/"+x.id,{fait:null}); if(T()[x.id]) T()[x.id].fait=null; rendre(); return; }
  var t=now();
  if(T()[x.id]) T()[x.id].fait=t;
  celebrer(x,true);
  await patch("/tasks/"+x.id,{fait:t});
  var cle=await marquerGeste(x,0);
  var p=await fermerParent(x);
  rendre();
  /* le filet de sécurité, après la fête pour ne pas la couvrir */
  setTimeout(function(){
    if(p){ celebrer(p,true); toast("Chantier terminé : "+p.t); }
    else toastAction("Réglé.","annuler",function(){ decocher(x.id,cle); });
  },1800);
  if(p) setTimeout(function(){
    toastAction("Réglé.","annuler",function(){ decocher(x.id,cle); });
  },3600);
}

/* ---------- MASQUER EN UN SEUL GESTE ----------
   Le cadenas est sur la ligne elle-même : pas de fiche à ouvrir, pas de menu.

/* ---------- DIVISER N'IMPORTE QUOI, N'IMPORTE QUAND ----------
   Une tâche trop grosse est la première cause de blocage. Il ne doit donc pas
   falloir la « convertir en chantier » dans un sous-menu avant de pouvoir la
   couper : le geste doit être à portée de doigt, sur la ligne elle-même.
   Ça marche aussi sur une étape — une étape qui se révèle trop grosse devient
   à son tour un chantier, sans limite de profondeur. */
async function diviser(id){
  var x=T()[id]; if(!x) return;
  if(!x.chantier){
    x.chantier=1;
    await patch("/tasks/"+id,{chantier:1});
  }
  decouper(id);
}
function boutonDiviser(id){

    'title="Diviser en étapes" aria-label="Diviser en étapes">✂</button>';

/* Le bouton lui-même. Jamais affiché au témoin : chez lui, ce qui est caché
   n'existe pas, et le reste n'a pas de cadenas à basculer. */
function boutonLock(id,prive){

    'title="'+(prive?"Caché du lien invité":"Visible par le lien invité")+'" '+

}

/* ============================================================
   CÉLÉBRATION — fonction centrale, pas décoration
   ============================================================ */
var MOTS_FIN=["Réglé.","Fait.","Une de moins.","C'est derrière toi.","Terminé.","Rayé."];
var MOTS_GESTE=["Compte comme une victoire.","Tu l'as touché.","Le plus dur est fait.","Départ pris."];
var MOTS_PLEIN=["Journée pleine. 🔥","Trois sur trois. 🔥","La journée est complète. 🔥"];
/* la grande fête ne se déclenche qu'une fois par jour, à la tâche qui ferme
   le trois sur trois — sinon elle ne voudrait plus rien dire */
var fetePleineLe=null;

function celebrer(x,complet,vieux){
  var f=el("fete"), a=iso();
  var pleine=!vieux&&jourPlein(a)&&fetePleineLe!==a;
  if(pleine) fetePleineLe=a;
  f.classList.remove("hide");
  f.classList.toggle("pleine",!!pleine);
  var g=gestesLe(a).length+1;
  var mot=vieux?"Déjà réglé. 👍"
        :pleine?MOTS_PLEIN[Math.floor(Math.random()*MOTS_PLEIN.length)]
        :complet?MOTS_FIN[Math.floor(Math.random()*MOTS_FIN.length)]
                :MOTS_GESTE[Math.floor(Math.random()*MOTS_GESTE.length)];
  var sous = x&&x.t ? esc(x.t.length>52?x.t.slice(0,50)+"…":x.t) : "";
  var sr=pleine?serie():null;
  f.innerHTML='<div class="mot">'+esc(mot)+
    '<small>'+sous+(vieux?'':' · '+g+' aujourd\'hui')+'</small>'+
    (sr?'<span class="gain">série portée à '+sr.n+' jour'+(sr.n>1?'s':'')+'</span>':'')+
    '</div>';
  effets(f,pleine);
  vibre(pleine?[20,55,20,55,45]:[12,50,26]);
  bip(pleine);
  setTimeout(function(){
    f.classList.add("hide"); f.classList.remove("pleine"); f.innerHTML="";
  }, pleine?2700:1750);
}

/* ---------- LES EFFETS ----------
   Rien de décoratif ici : c'est la récompense immédiate qui manque au cerveau
   quand la tâche, elle, ne rapporte rien tout de suite. Le flash arrive avant
   la conscience du geste, les ondes donnent l'impact, les confettis tombent
   avec de la gravité, et les étincelles montent — comme une poussée. */
function effets(box,pleine){
  flash(box);
  onde(box,pleine);
  confettis(box,pleine?66:30);
  etincelles(box,pleine?28:14);
}
function flash(box){
  var d=document.createElement("i"); d.className="flash"; box.appendChild(d);
  d.animate([{opacity:0},{opacity:1,offset:.12},{opacity:0}],
    {duration:640,easing:"ease-out"}).onfinish=function(){ d.remove(); };
}
function onde(box,pleine){
  for(var i=0;i<(pleine?3:2);i++)(function(i){
    var d=document.createElement("i"); d.className="onde"; box.appendChild(d);
    d.animate([{transform:"scale(.3)",opacity:.85},{transform:"scale("+(pleine?17:11)+")",opacity:0}],
      {duration:900+i*190,delay:i*140,easing:"cubic-bezier(.15,.7,.3,1)"}).onfinish=function(){ d.remove(); };
  })(i);
}
function confettis(box,n){
  var c=["#ff9f1c","#2ee27a","#ffd23f","#5ec8ff","#ff6b81","#fff3c4"];
  var formes=["","rond","ruban"];
  n=n||30;
  for(var i=0;i<n;i++){
    var d=document.createElement("i");
    d.className="part "+formes[i%3];
    d.style.background=c[i%c.length];
    d.style.left=(42+Math.random()*16)+"%"; d.style.top=(44+Math.random()*10)+"%";
    box.appendChild(d);
    (function(d){
      var ang=Math.random()*Math.PI*2, v=140+Math.random()*270;
      var dx=Math.cos(ang)*v, dy=Math.sin(ang)*v;
      var r1=Math.random()*360-180, r2=Math.random()*900-450;
      d.animate([
        {transform:"translate(0,0) rotate(0) scale(1)",opacity:1},
        {transform:"translate("+(dx*.6)+"px,"+(dy*.6-45)+"px) rotate("+r1+"deg)",opacity:1,offset:.42},
        {transform:"translate("+dx+"px,"+(dy+280)+"px) rotate("+r2+"deg) scale(.85)",opacity:0}
      ],{duration:1250+Math.random()*850,easing:"cubic-bezier(.15,.6,.35,1)"})
       .onfinish=function(){ d.remove(); };
    })(d);
  }
}
function etincelles(box,n){
  for(var i=0;i<n;i++)(function(){
    var d=document.createElement("i"); d.className="spark";
    d.style.left=(Math.random()*100)+"%";
    box.appendChild(d);
    var h=(window.innerHeight||700)*(.45+Math.random()*.5);
    d.animate([{transform:"translateY(0) scaleY(1)",opacity:0},
               {opacity:1,offset:.15},
               {transform:"translateY(-"+h+"px) scaleY(1.7)",opacity:0}],
      {duration:900+Math.random()*750,delay:Math.random()*280,easing:"cubic-bezier(.2,.7,.3,1)"})
     .onfinish=function(){ d.remove(); };
  })();
}
var actx=null;
function bip(pleine){
  if(ls(K_SON)==="0") return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    var t=actx.currentTime;
    /* la journée pleine monte plus haut et finit sur une quinte : l'oreille
       entend tout de suite que ce n'est pas la même chose */
    (pleine?[587.33,880,1174.66,1567.98,2093]:[587.33,880,1174.66]).forEach(function(f,i){
      var o=actx.createOscillator(), g=actx.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*.075);
      g.gain.linearRampToValueAtTime(pleine?.15:.13,t+i*.075+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t+i*.075+(pleine?.42:.3));
      o.connect(g); g.connect(actx.destination); o.start(t+i*.075); o.stop(t+i*.075+.46);
    });
  }catch(e){}
}

/* ---------- LA SÉRIE, EN GROS ----------
   Le seul endroit de l'app où un chiffre a le droit d'être spectaculaire.
   La réserve de jetons vit juste en dessous : c'est elle qui explique
   pourquoi la série tient, donc elle ne se cache pas dans les réglages. */
var dernierStreak=null;
function blocStreak(){
  var sr=serie(), jr=jetonsReste();
  var vues=Math.min(jr,8), pas="";
  for(var i=0;i<vues;i++) pas+='<i class="jeton"></i>';
  if(!jr) pas='<i class="jeton off"></i>';
  var bj='<div class="jetons"><span class="pastilles">'+pas+'</span><span>'+
    (jr?'<b>'+jr+'</b> jeton'+(jr>1?'s':'')+' en réserve':'aucun jeton en réserve')+
    ' · <b>+1</b> chaque semaine</span></div>';

  if(!sr.n){
    return '<div class="streak vide"><div class="feu">🔥</div><div class="n">0</div>'+
      '<div class="lab">jour d\'affilée à trois sur trois</div>'+
      '<div class="sous">Coche les trois tâches d\'une journée et la série part.</div>'+bj+'</div>';
  }
  return '<div class="streak"><div class="feu">🔥</div>'+
    '<div class="n" id="streakN">'+sr.n+'</div>'+
    '<div class="lab">jour'+(sr.n>1?'s':'')+' d\'affilée à trois sur trois</div>'+
    (sr.blanches?'<div class="sous">'+(sr.blanches>1
      ? sr.blanches+' jetons ont tenu la série pendant tes jours manqués'
      : 'un jeton a tenu la série pendant un jour manqué')+'</div>':'')+
    bj+'</div>';
}
/* la série qui monte doit se voir bouger, pas juste changer de chiffre */
function animerStreak(){
  var n=el("streakN"); if(!n) return;
  var v=serie().n;
  if(dernierStreak!==null&&v>dernierStreak){
    n.classList.add("pulse");
    setTimeout(function(){ if(n) n.classList.remove("pulse"); },900);
  }
  dernierStreak=v;
}
